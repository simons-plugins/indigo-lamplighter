# Runs the pytest suite on every PR and on every push to main.
#
# The plugin is stdlib-only; the SUITE needs jsonschema (dev-only, to
# prove schema.json is valid JSON Schema and that the loader agrees with
# it) plus pytest. Matrix: 3.10 is the floor the plugin claims, 3.13 is
# what jarvis actually runs (IndigoPluginHost3 -> 3.13). fail-fast off
# so a version-specific breakage is visible as such.

name: Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install pytest jsonschema

      - name: Run test suite
        run: python3 -m pytest -q
