<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="indigo-page-name" content="Lamplighter">
<meta name="indigo-page-icon" content="lamp.fill">
<meta name="indigo-page-description" content="Live zone status for the Lamplighter presence/daylight lighting engine">
<title>Lamplighter</title>
<style>
:root{--bg:#f7f4ef;--card-bg:#fff;--text:#1d1a15;--text-secondary:#8a8378;--border:#e2dbcd;
--accent:#c9822f;--on-color:#3a9d5c;--warn:#c9822f;--bad:#c1442c;--muted:#a39b8c;
--chip-bg:#efe9dc;--shadow:0 1px 3px rgba(0,0,0,.08);
--band-on:rgba(58,157,92,.35);--band-off:var(--muted);--now-line:var(--text)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17140f;--card-bg:#241f18;
--text:#f2ede2;--text-secondary:#a89f8f;--border:#3a342a;--accent:#e0a04b;--on-color:#4cb772;
--warn:#e0a04b;--bad:#e0654a;--muted:#6f6858;--chip-bg:#2e281f;--shadow:0 1px 3px rgba(0,0,0,.4);
--band-on:rgba(76,183,114,.35);--band-off:var(--muted);--now-line:var(--text)}}
:root[data-theme="dark"]{--bg:#17140f;--card-bg:#241f18;--text:#f2ede2;--text-secondary:#a89f8f;
--border:#3a342a;--accent:#e0a04b;--on-color:#4cb772;--warn:#e0a04b;--bad:#e0654a;--muted:#6f6858;
--chip-bg:#2e281f;--shadow:0 1px 3px rgba(0,0,0,.4);
--band-on:rgba(76,183,114,.35);--band-off:var(--muted);--now-line:var(--text)}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
background:var(--bg);color:var(--text);font-size:17px;-webkit-font-smoothing:antialiased;
padding:16px;padding-top:max(16px,env(safe-area-inset-top));
padding-bottom:max(32px,env(safe-area-inset-bottom));
padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.wrap{max-width:1200px;margin:0 auto}
h1{font-size:28px;margin:0 0 4px;letter-spacing:-.02em}
.updated{font-size:13px;color:var(--text-secondary);margin-bottom:14px;font-variant-numeric:tabular-nums}
.banner{border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.4;margin-bottom:14px;display:none}
.banner.show{display:block}
.banner.bad{background:rgba(193,68,44,.14);color:var(--bad);border:1px solid rgba(193,68,44,.3)}
.hdr{background:var(--card-bg);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;
margin-bottom:16px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;font-size:14px;
color:var(--text-secondary)}
.hdr b{color:var(--text);font-weight:600}
.hdr .sep{color:var(--border)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;align-items:stretch}
.card{background:var(--card-bg);border-radius:14px;box-shadow:var(--shadow);padding:16px;
display:flex;flex-direction:column}
.card.disabled{opacity:.6}

/* ── title row + chip ─────────────────────────────────────────────────── */
.crow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.zname{font-size:18px;font-weight:600;letter-spacing:-.01em}
.chip{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
padding:4px 10px;border-radius:999px;white-space:nowrap;flex:0 0 auto}
.chip.occupied{background:rgba(58,157,92,.16);color:var(--on-color)}
.chip.vacant{background:var(--chip-bg);color:var(--text-secondary)}
.chip.overridden{background:rgba(201,130,47,.18);color:var(--warn)}
.chip.offduty{background:var(--chip-bg);color:var(--muted)}
.chip.disabled{background:var(--chip-bg);color:var(--muted)}
.chip.unknown{background:var(--chip-bg);color:var(--muted)}
.subline{font-size:12px;color:var(--text-secondary);margin-top:2px;line-height:1.4}

/* ── verdict: the most prominent line on the card ────────────────────── */
.verdict{font-size:16px;line-height:1.4;font-weight:500;color:var(--text);margin:10px 0}

/* ── facts grid ───────────────────────────────────────────────────────── */
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 12px;margin-bottom:12px}
.fact-label{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
color:var(--text-secondary);margin-bottom:2px}
.fact-value{font-size:14px;color:var(--text);line-height:1.3;word-break:break-word}

/* ── day strip ────────────────────────────────────────────────────────── */
.strip-wrap{margin-bottom:12px}
.strip{position:relative;height:26px;border-radius:6px;background:var(--chip-bg);overflow:hidden}
.band{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;
font-size:10px;font-weight:600;color:var(--text);overflow:hidden;white-space:nowrap;
border-left:1px solid var(--card-bg);border-right:1px solid var(--card-bg)}
.band.on_and_off{background:var(--band-on)}
.band.off_only{background:repeating-linear-gradient(45deg,var(--band-off) 0,var(--band-off) 3px,
transparent 3px,transparent 7px);opacity:.55}
.band.active{border:2px solid var(--accent);border-radius:3px}
/* The sun fell back to a fixed time for this entry: the band is a real
   period at an unreal time, so it reads as drawn rather than measured. */
.band.approximate{outline:2px dashed var(--warn);outline-offset:-2px;opacity:.7}
/* A pill behind the name keeps it legible over the off_only hatching and
   where the now-line crosses a band. */
.band .blabel{background:var(--card-bg);color:var(--text);padding:1px 7px;border-radius:999px;
opacity:.92;position:relative;z-index:1}
.now-line{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--now-line);z-index:2}
.ticks{display:flex;justify-content:space-between;font-size:10px;color:var(--text-secondary);
margin-top:3px;font-variant-numeric:tabular-nums}
.strip-note{font-size:12px;color:var(--text-secondary);margin-bottom:12px}

/* ── lights list ──────────────────────────────────────────────────────── */
.section-label{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
color:var(--text-secondary);display:flex;justify-content:space-between;align-items:baseline;
margin-bottom:6px}
.section-label .off-target{color:var(--bad);font-weight:700;text-transform:none;letter-spacing:0}
.section-label .off-unknown{color:var(--warn);font-weight:700;text-transform:none;letter-spacing:0;margin-left:8px}
.lights{list-style:none;margin:0 0 12px;padding:0;font-size:13px}
.lights li{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border)}
.lights li:last-child{border-bottom:none}
.lights .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:transparent}
.lights li.mismatch .dot{background:var(--bad)}
.lights .lname{flex:1 1 auto;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;
white-space:nowrap}
.lights li.mismatch .lname{color:var(--text)}
.lights .ldesired,.lights .lactual{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12px}
.lights .ldesired{color:var(--text-secondary)}
.lights .lactual{color:var(--text-secondary)}
.lights li.mismatch .lactual{color:var(--bad);font-weight:600}
.lights .larrow{color:var(--text-secondary);font-size:11px}

/* ── presence chips ───────────────────────────────────────────────────── */
.presence-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pchip{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--border);
color:var(--text-secondary);white-space:nowrap}
.pchip.on{background:var(--on-color);border-color:var(--on-color);color:#fff}
.pchip.off{background:transparent}
.pchip.unknown{background:transparent;border-style:dashed}
.pchip .last{font-weight:700}

/* ── footer ───────────────────────────────────────────────────────────── */
.foot{border-top:1px solid var(--border);padding-top:10px;font-size:13px;margin-top:auto;
display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 10px}
.disclosure{background:none;border:none;color:var(--accent);font:inherit;font-size:13px;font-weight:600;
padding:6px 0;cursor:pointer;min-height:32px;display:flex;align-items:center;gap:6px}
.disclosure .tri{display:inline-block;transition:transform .15s ease;font-size:11px}
.disclosure[aria-expanded="true"] .tri{transform:rotate(90deg)}
@media (prefers-reduced-motion:reduce){.disclosure .tri{transition:none}}
.counters{color:var(--text-secondary);font-variant-numeric:tabular-nums;white-space:nowrap}
.explain{font-size:13px;line-height:1.5;color:var(--text-secondary);margin:8px 0 0;
font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;
word-break:break-word;width:100%}
.empty{color:var(--text-secondary);text-align:center;padding:40px 16px;font-size:15px}
[hidden]{display:none!important}

@media (max-width:640px){
  .grid{grid-template-columns:1fr}
  .facts{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:480px){
  .band span.blabel{display:none}
  .ticks{font-size:9px}
}
</style>

<body>
<div class="wrap">
<h1>Lamplighter</h1>
<div class="updated" id="updated"></div>
<div id="err" class="banner bad"></div>

<div class="hdr" id="hdr" hidden></div>

<div id="empty" class="empty" hidden>No Lamplighter zones found.</div>
<div class="grid" id="grid"></div>
</div>

<script>
// -- indigo-api.js V1, inlined (pages must be self-contained) and modified: read-only, observe()/observeAll() call back on every fetch and take an onOk hook -- see the comments on observe(). --
class IndigoAPI {
    constructor(config) {
        const cfg = config || window.INDIGO_CONFIG || IndigoAPI._configFromURL();
        if (!cfg || !cfg.baseURL || !cfg.apiKey) {
            this._configured = false;
            this._showConfigError();
            return;
        }
        this._configured = true;
        this._baseURL = cfg.baseURL.replace(/\/+$/, "");
        this._apiKey = cfg.apiKey;
        this._errorHandler = null;
        this._authFailureHandler = null;
    }

    static isConfigured() {
        const cfg = window.INDIGO_CONFIG || IndigoAPI._configFromURL();
        return !!(cfg && cfg.baseURL && cfg.apiKey);
    }

    static _configFromURL() {
        if (typeof location === "undefined") return null;
        const params = new URLSearchParams(location.search);
        const apiKey = params.get("api-key");
        if (!apiKey) return null;
        return { baseURL: location.origin, apiKey };
    }

    async getDevices() {
        return this._getList("/v2/api/indigo.devices");
    }

    async getDevice(id) {
        return this._get(`/v2/api/indigo.devices/${id}`);
    }

    // Read-only page: this class keeps the shared IndigoAPI shape from the
    // skill reference, but the command helpers (turnOn/setBrightness/etc.)
    // are intentionally omitted — Lamplighter status never sends commands.

    // Self-scheduling: the next poll is only queued once the current one has
    // settled (in `finally`), so a slow endpoint cannot stack overlapping
    // requests or deliver them out of order. `callback` runs on every
    // successful fetch, raw payload and all; `onOk`, when given, also runs on
    // every successful fetch, before `callback` -- callers use it for things
    // like an "updated" timestamp or clearing a transport error banner, kept
    // separate so `callback` is free to do its own diffing for a DOM rebuild
    // without that diff swallowing onOk's per-poll bookkeeping.
    observe(deviceId, callback, intervalMs = 5000, onOk = null) {
        return this._pollLoop(() => this.getDevice(deviceId), callback, intervalMs, onOk);
    }

    observeAll(callback, intervalMs = 5000, onOk = null) {
        return this._pollLoop(() => this.getDevices(), callback, intervalMs, onOk);
    }

    _pollLoop(fetchFn, callback, intervalMs, onOk) {
        let stopped = false;
        let timer = null;
        const poll = async () => {
            try {
                const result = await fetchFn();
                if (onOk) { try { onOk(result); } catch (_) { /* caller's problem, not ours */ } }
                callback(result);
            } catch (err) {
                this._handleError(err);
            } finally {
                if (!stopped) timer = setTimeout(poll, intervalMs);
            }
        };
        poll();
        return { stop: () => { stopped = true; if (timer !== null) clearTimeout(timer); } };
    }

    onError(callback) {
        this._errorHandler = callback;
    }

    onAuthFailure(callback) {
        this._authFailureHandler = callback;
    }

    async _get(path) {
        return this._fetch(path, { method: "GET" });
    }

    async _getList(path) {
        return this._fetch(path, { method: "GET" });
    }

    async _fetch(path, options = {}) {
        this._requireConfigured();

        const url = `${this._baseURL}${path}`;
        const headers = {
            Authorization: `Bearer ${this._apiKey}`,
            Accept: "application/json",
            ...options.headers,
        };

        let response;
        try {
            response = await fetch(url, { ...options, headers });
        } catch (err) {
            const error = new IndigoAPIError("Network error: " + err.message, 0, err);
            this._handleError(error);
            throw error;
        }

        if (response.status === 401 || response.status === 403) {
            const error = new IndigoAPIError(
                "Authentication failed — check your API key",
                response.status
            );
            if (this._authFailureHandler) this._authFailureHandler(error);
            this._handleError(error);
            throw error;
        }

        if (!response.ok) {
            const text = await response.text().catch(() => "");
            const error = new IndigoAPIError(
                `HTTP ${response.status}: ${text || response.statusText}`,
                response.status
            );
            this._handleError(error);
            throw error;
        }

        const contentType = response.headers.get("Content-Type") || "";
        if (!contentType.includes("json")) return null;

        try {
            return await response.json();
        } catch (err) {
            const error = new IndigoAPIError("Invalid JSON response", response.status, err);
            this._handleError(error);
            throw error;
        }
    }

    _requireConfigured() {
        if (!this._configured) {
            throw new IndigoAPIError(
                "IndigoAPI is not configured — window.INDIGO_CONFIG is missing or incomplete",
                0
            );
        }
    }

    _handleError(error) {
        if (this._errorHandler) {
            try { this._errorHandler(error); } catch (_) { /* prevent handler errors from cascading */ }
        }
    }

    _showConfigError() {
        if (typeof document === "undefined") return;
        const banner = document.createElement("div");
        banner.id = "indigo-config-error";
        banner.style.cssText =
            "position:fixed;top:0;left:0;right:0;padding:12px 16px;" +
            "background:#dc3545;color:#fff;font:14px/1.4 -apple-system,sans-serif;" +
            "text-align:center;z-index:99999;";
        banner.textContent = "Indigo connection not configured. Set window.INDIGO_CONFIG or add ?api-key= to the URL.";
        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", () => document.body.prepend(banner));
        } else {
            document.body.prepend(banner);
        }
    }
}

class IndigoAPIError extends Error {
    constructor(message, status, cause) {
        super(message);
        this.name = "IndigoAPIError";
        this.status = status;
        if (cause) this.cause = cause;
    }
}
</script>
<script>
// ── page logic ──────────────────────────────────────────────────────────
const PLUGIN_ID = "com.simons-plugins.indigo-lamplighter";
const ZONE_TYPE = "lamplighter_zone";
const CTRL_TYPE = "lamplighter_controller";
const NAME_PREFIX = /^Lamplighter - /;
const MINUTES_PER_DAY = 1440;
const MANUAL_LOCK_DEVICE_ID = "-1";

const $ = id => document.getElementById(id);
let indigo = null, watcher = null;
let openIds = new Set();         // disclosures the user has opened, kept open across re-renders
let deviceNames = {};            // id -> name, rebuilt whenever render() rebuilds the DOM (payload changed)
let deviceById = {};             // id -> full device object, for reading actual state (brightness/onState)
let lastRenderedJson = null;     // gates the DOM rebuild only; reset to null on any error so the next success rebuilds -- see render()
let authFailed = false;

function showErr(msg) {
  const el = $("err");
  el.textContent = msg;
  el.classList.toggle("show", !!msg);
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "";
  return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

function fmtClock(d) {
  return d.toLocaleTimeString([], { hour12: false });
}

function zoneName(dev) {
  return (dev.name || "").replace(NAME_PREFIX, "");
}

// A device's on/off arrives at the top level as `onState` over the REST API;
// `onOffState` only exists inside `states`. A zone that is off is disabled.
// The `states.onOffState` fallback covers a payload that omits `onState` (a
// device still starting); it deliberately never overrides a present `onState`.
function isOff(dev) {
  if (dev.onState === false) return true;
  const st = dev.states || {};
  return dev.onState == null && st.onOffState === false;
}

// ── parsing helpers (pure — table-driven-tested under node) ─────────────

function parseDesired(summary) {
  // "144694384=100, 772478931=50, ..." -> { items: [{id, level}], unparsedCount }
  if (typeof summary !== "string" || !summary) return { items: [], unparsedCount: 0 };
  const items = [];
  let unparsedCount = 0;
  for (const pair of summary.split(",").map(p => p.trim()).filter(Boolean)) {
    const eq = pair.indexOf("=");
    const id = eq < 0 ? "" : pair.slice(0, eq).trim();
    if (eq < 0 || !id) { unparsedCount++; continue; }
    items.push({ id, level: pair.slice(eq + 1).trim() });
  }
  return { items, unparsedCount };
}

function levelLabel(level) {
  if (level === "leave") return "left alone";
  if (level === "off") return "off";
  if (level === "on") return "on";
  const n = parseInt(level, 10);
  if (!isNaN(n) && String(n) === level) return n + " %";
  return level;
}

function isNumericLevel(level) {
  const n = parseInt(level, 10);
  return !isNaN(n) && String(n) === String(level);
}

// Does this desired level mean "the light should be showing some light at
// all"? Used by verdictFor() to decide between "nothing to switch" and
// "lights at X levels", and between plain "off" and "dimmed to vacant
// levels" — the same question in both states, just a different period plan.
function levelIsOnish(level) {
  if (level === "on") return true;
  if (isNumericLevel(level)) return parseInt(level, 10) > 0;
  return false;
}

// This device's actual state, read the same way for every desired level:
// { kind: "dimmer"|"relay"|"unknown", on, brightness }. `brightness` is only
// meaningful for a dimmer. A device absent from the device list (gone, or a
// lookup that failed — the zone's explain lists it under "unavailable
// lights") reads "unknown" rather than guessing at "off", which would hide
// the very degradation R15 asks every part of this plugin to say out loud.
// A device that IS in the payload but carries no on/off reading at all
// (`onState` absent at the top level and `states.onOffState` absent too —
// still starting, or a payload shape this page has not seen) is the same
// kind of blank: it is not "off", it is "nothing read yet".
function actualState(dev) {
  if (!dev) return { kind: "unknown" };
  if (dev.onState == null && (dev.states || {}).onOffState == null) return { kind: "unknown" };
  if (typeof dev.brightness === "number") {
    return { kind: "dimmer", on: !!dev.onState, brightness: dev.onState ? dev.brightness : 0 };
  }
  return { kind: "relay", on: isOff(dev) ? false : !!dev.onState };
}

function actualLabel(dev) {
  const st = actualState(dev);
  if (st.kind === "unknown") return "unknown";
  if (st.kind === "dimmer") return st.on ? `${st.brightness} %` : "off";
  return st.on ? "on" : "off";
}

// Is `desiredLevel` for this device visibly different from what it is
// actually doing right now? `"leave"` (the plugin never writes this device)
// and an unresolved device (nothing to compare against) never mismatch —
// see actualState() above on why an unknown must not read as a mismatch.
function mismatch(desiredLevel, actualDevice) {
  if (desiredLevel == null || desiredLevel === "leave") return false;
  const st = actualState(actualDevice);
  if (st.kind === "unknown") return false;

  if (desiredLevel === "off") return st.kind === "dimmer" ? st.brightness > 0 : st.on === true;
  if (desiredLevel === "on") return st.kind === "dimmer" ? st.brightness <= 0 : st.on === false;
  if (isNumericLevel(desiredLevel)) {
    const target = parseInt(desiredLevel, 10);
    if (st.kind !== "dimmer") return (target > 0) !== st.on;
    return !levelMatches(st.brightness, target);
  }
  return false;
}

// The engine's own R5 tolerance (compare.level_matches), ported verbatim so
// the red dot never contradicts what the plugin will actually rewrite: a
// band of max(1, ceil(10 % of target)) either side, with 0 and 100 exact.
// A flat ±3 here would flag a group dimmer reading 46 for 50 that the
// plugin has (rightly) left alone, and miss a 13 for 10 that it is chasing.
function levelMatches(actual, target) {
  if (target <= 0 || target >= 100) return actual === target;
  return Math.abs(actual - target) <= Math.max(1, Math.ceil(target * 0.10));
}

function lightName(id) {
  return deviceNames[id] || ("#" + id);
}

// "HH:MM" -> minutes since local midnight. Never throws: a value that will
// not parse reads as 0 rather than NaN poisoning the band's position.
function timeToMinutes(hhmm) {
  const m = /^([0-9]{1,2}):([0-9]{2})$/.exec(String(hhmm || ""));
  if (!m) return 0;
  return (parseInt(m[1], 10) * 60 + parseInt(m[2], 10)) % MINUTES_PER_DAY;
}

// One period's { from, to } (both "HH:MM") as one or two horizontal bar
// segments, each `{ startPct, widthPct }` of the 24-hour strip. Two segments
// come out when `to <= from` — the period crosses midnight (periods_today
// publishes it exactly that way; see zone.py's `_periods_today_json`) — so
// the wrap always draws as an end-of-day piece plus a start-of-day piece
// rather than one backwards or one full-width band.
function bandSegments(period) {
  const from = timeToMinutes(period.from);
  const to = timeToMinutes(period.to);
  if (to > from) {
    return [{ startPct: (from / MINUTES_PER_DAY) * 100, widthPct: ((to - from) / MINUTES_PER_DAY) * 100 }];
  }
  const segments = [];
  if (from < MINUTES_PER_DAY) {
    segments.push({ startPct: (from / MINUTES_PER_DAY) * 100, widthPct: ((MINUTES_PER_DAY - from) / MINUTES_PER_DAY) * 100 });
  }
  if (to > 0) {
    segments.push({ startPct: 0, widthPct: (to / MINUTES_PER_DAY) * 100 });
  }
  return segments;
}

// Sort key for "attention order": overridden first, then occupied, vacant,
// off-duty, disabled; anything with no state yet after that — ties broken by
// name at the call site. Table-driven-tested directly against the (states,
// isOffFlag) inputs render() already has on hand, rather than against a
// whole device object.
function sortRank(states, isOffFlag) {
  if (isOffFlag) return 4;
  switch ((states || {}).state) {
    case "overridden": return 0;
    case "occupied": return 1;
    case "vacant": return 2;
    case "off_duty": return 3;
    default: return 5; // no states yet / unrecognised — after disabled, per the comment above
  }
}

// The chip: label and CSS class, for any zone state.
function chipFor(states, isOffFlag) {
  if (isOffFlag) return { cls: "disabled", label: "DISABLED" };
  const s = states || {};
  switch (s.state) {
    case "occupied": return { cls: "occupied", label: "OCCUPIED" };
    case "vacant": return { cls: "vacant", label: "VACANT" };
    case "overridden": {
      const until = fmtTime(s.override_expires);
      return { cls: "overridden", label: "OVERRIDDEN" + (until ? " · until " + until : "") };
    }
    case "off_duty": {
      const causeText = { bright: " · bright", no_period: " · no period", disabled: " · disabled" }[s.off_duty_cause] || "";
      return { cls: "offduty", label: "OFF DUTY" + causeText };
    }
    default: return { cls: "vacant", label: (s.state || "UNKNOWN").toUpperCase() };
  }
}

// The one-sentence verdict: the most prominent text on the card, built only
// from states and the device list — never from parsing `explain`'s prose,
// which is what the 2026.3.0 card used to do.
function verdictFor(states, isOffFlag) {
  if (isOffFlag) return "Zone switched off in Indigo.";
  const s = states || {};
  const { items } = parseDesired(s.desired_summary);
  const anyOnish = items.some(it => levelIsOnish(it.level));
  const period = s.period || "";

  switch (s.state) {
    case "occupied":
      return anyOnish
        ? `Someone is here — lights at ${period || "this period's"} levels.`
        : `Someone is here — nothing to switch in ${period || "this period"}.`;
    case "vacant": {
      const since = fmtTime(s.presence_last_seen);
      return anyOnish
        ? `Empty${since ? " since " + since : ""} — lights dimmed to vacant levels.`
        : `Empty${since ? " since " + since : ""} — lights off.`;
    }
    case "overridden": {
      const until = fmtTime(s.override_expires);
      return `Changed by hand — holding whatever the lights are now until ${until || "it expires"}.`;
    }
    case "off_duty":
      switch (s.off_duty_cause) {
        case "bright": {
          const n = (s.lux !== "" && s.lux != null) ? Math.round(parseFloat(s.lux)) : NaN;
          return `Bright enough${!isNaN(n) ? ` (${n} lx)` : ""} — lights left off.`;
        }
        case "no_period": return "No period covers now — lights left alone.";
        case "disabled": return "Zone disabled — lights left alone.";
        default: return "Off duty — lights left alone.";
      }
    default: return "";
  }
}

function presenceFact(s) {
  if (s.presence_active === true) return "here";
  if (s.presence_last_seen) return "last seen " + fmtTime(s.presence_last_seen);
  return "never";
}

function lightFact(s) {
  const dark = s.dark === true;
  const label = s.dark == null ? "" : (dark ? "dark" : "bright");
  if (s.lux !== "" && s.lux != null) {
    const n = Math.round(parseFloat(s.lux));
    if (!isNaN(n)) return label ? `${n} lx · ${label}` : `${n} lx`;
  }
  return label || "unknown";
}

function overrideOwnerLabel(s) {
  if (s.override_device === "" || s.override_device == null) return "";
  return String(s.override_device) === MANUAL_LOCK_DEVICE_ID ? "manual lock" : lightName(String(s.override_device));
}

function overrideFact(s) {
  const owner = overrideOwnerLabel(s);
  if (!owner) return "none";
  const until = fmtTime(s.override_expires);
  return until ? `${owner} until ${until}` : owner;
}

// Minutes remaining until `expiresIso`, recomputed fresh at call time so it
// stays honest across a 5-second poll interval without the server sending
// a new value. null when there is nothing to count down (no override, or an
// unparseable timestamp) rather than a made-up 0.
function minutesLeft(expiresIso, now = new Date()) {
  if (!expiresIso) return null;
  const exp = new Date(expiresIso);
  if (isNaN(exp.getTime())) return null;
  return Math.max(0, Math.round((exp.getTime() - now.getTime()) / 60000));
}

function presenceInputLabel(entry) {
  if (entry.kind === "device") return lightName(String(entry.id));
  if (entry.name) return "var " + String(entry.name).replace(/^variable /, "");
  return "var " + entry.id;
}

// `parts` is a mix of plain strings (rendered as text) and
// { text, style } objects (rendered inside a <b>) -- never raw HTML, since
// `config_status` in particular is free-form text from the loader that may
// echo back content of the config file.
function addParts(hdr, parts) {
  const span = document.createElement("span");
  for (const part of parts) {
    if (typeof part === "string") {
      span.appendChild(document.createTextNode(part));
      continue;
    }
    const b = document.createElement("b");
    if (part.style) b.style.cssText = part.style;
    b.textContent = part.text;
    span.appendChild(b);
  }
  hdr.appendChild(span);
}

function renderHeader(ctrl, offTargetCount, unknownCount = 0) {
  const hdr = $("hdr");
  if (!ctrl) { hdr.hidden = true; return; }
  const s = ctrl.states || {};
  hdr.hidden = false;
  hdr.textContent = "";
  addParts(hdr, [{
    text: isOff(ctrl) ? "Disabled" : "Enabled",
    style: isOff(ctrl) ? "color:var(--bad)" : "color:var(--on-color)",
  }]);
  const total = s.zones != null ? s.zones : "?";
  const enabled = s.zones_enabled != null ? s.zones_enabled : "?";
  const overridden = s.zones_overridden != null ? s.zones_overridden : 0;
  addParts(hdr, [
    { text: String(total) }, " zones (", { text: String(enabled) }, " enabled, ",
    { text: String(overridden) }, " overridden)",
  ]);
  if (offTargetCount > 0) {
    addParts(hdr, [{ text: `${offTargetCount} light${offTargetCount === 1 ? "" : "s"} off target`, style: "color:var(--bad)" }]);
  }
  // A separate, amber note: these lights were never compared at all (no
  // on/off reading to compare against), which must not read as silence —
  // an all-unknown zone would otherwise show 0 off target and look fine.
  if (unknownCount > 0) {
    addParts(hdr, [{ text: `${unknownCount} light${unknownCount === 1 ? "" : "s"} unknown`, style: "color:var(--warn)" }]);
  }
  if (s.config_status) addParts(hdr, ["config: ", { text: s.config_status }]);
  const ev = s.evaluations_today != null ? s.evaluations_today : 0;
  const wr = s.writes_today != null ? s.writes_today : 0;
  const ov = s.overrides_today != null ? s.overrides_today : 0;
  addParts(hdr, [
    "today: ", { text: String(wr) }, " writes · ", { text: String(ev) }, " evals · ",
    { text: String(ov) }, " overrides",
  ]);
  if (s.config_loaded_at) addParts(hdr, ["loaded " + fmtTime(s.config_loaded_at)]);
}

// ── card sections ─────────────────────────────────────────────────────

function buildTitleRow(dev, s, offFlag) {
  const crow = document.createElement("div");
  crow.className = "crow";
  const nameEl = document.createElement("div");
  nameEl.className = "zname";
  nameEl.textContent = zoneName(dev);
  const chipInfo = chipFor(s, offFlag);
  const chipEl = document.createElement("span");
  chipEl.className = "chip " + chipInfo.cls;
  chipEl.textContent = chipInfo.label;
  crow.appendChild(nameEl);
  crow.appendChild(chipEl);
  return crow;
}

function buildOverrideSubline(s) {
  if (s.state !== "overridden") return null;
  const owner = overrideOwnerLabel(s);
  const since = fmtTime(s.persist_override_since);
  const left = minutesLeft(s.override_expires);
  const parts = [];
  if (owner) parts.push(`taken by ${owner}`);
  if (since) parts.push(`at ${since}`);
  if (left != null) parts.push(`${left} min left`);
  if (!parts.length) return null;
  const div = document.createElement("div");
  div.className = "subline";
  div.textContent = parts.join(" · ");
  return div;
}

function buildFacts(s) {
  const facts = document.createElement("div");
  facts.className = "facts";
  const rows = [
    ["Period", s.period || "none"],
    ["Light", lightFact(s)],
    ["Presence", presenceFact(s)],
    ["Override", overrideFact(s)],
  ];
  for (const [label, value] of rows) {
    const cell = document.createElement("div");
    const lbl = document.createElement("div");
    lbl.className = "fact-label";
    lbl.textContent = label;
    const val = document.createElement("div");
    val.className = "fact-value";
    val.textContent = value;
    cell.appendChild(lbl);
    cell.appendChild(val);
    facts.appendChild(cell);
  }
  return facts;
}

function parsePeriodsToday(raw) {
  if (raw === "unavailable" || raw === "" || raw == null) {
    return { periods: [], unavailable: raw === "unavailable", malformed: false };
  }
  try {
    const parsed = JSON.parse(raw);
    return { periods: Array.isArray(parsed) ? parsed : [], unavailable: false, malformed: false };
  } catch (_) {
    // Distinct from a genuine "[]": the field held something, but it wasn't
    // readable JSON, so an empty strip here would look identical to a zone
    // with no periods configured today. Surface it the same way `unavailable`
    // is surfaced, rather than swallowing it into a silent empty list.
    return { periods: [], unavailable: false, malformed: true };
  }
}

// "HH:MM", strictly -- the same shape `timeToMinutes` accepts, checked
// separately here because `timeToMinutes` itself must stay total (0 for
// garbage) for the arithmetic downstream; this is the gate that decides
// whether an entry is drawn at all.
const PERIOD_TIME_RE = /^([0-9]{1,2}):([0-9]{2})$/;

function validPeriodEntry(period) {
  return !!period && typeof period === "object" &&
    typeof period.name === "string" &&
    typeof period.from === "string" && PERIOD_TIME_RE.test(period.from) &&
    typeof period.to === "string" && PERIOD_TIME_RE.test(period.to);
}

// Splits a parsed `periods_today` array into the entries worth drawing and a
// count of the ones that are not -- garbage from a payload this page cannot
// trust wholesale just because it parsed as JSON. The good entries are kept
// in order, so the strip still reads left-to-right; the bad ones are simply
// gone from the strip and only survive as a count in the note.
function splitValidPeriods(periods) {
  const valid = [];
  let invalidCount = 0;
  for (const period of periods) {
    if (validPeriodEntry(period)) valid.push(period); else invalidCount++;
  }
  return { valid, invalidCount };
}

// The `.strip-note` text under the ticks, or "" for a strip with nothing to
// say. Combines two independent degradations that can both be true at
// once: some entries drawn are approximate (the sun fell back -- A2/A3),
// and some entries in the payload could not be drawn at all (B/8). Pure, so
// it is unit-tested directly rather than through a DOM diff.
function stripNoteFor(periods, invalidCount) {
  const notes = [];
  if (Array.isArray(periods) && periods.some(p => p && p.approximate)) {
    notes.push("sun times unavailable — periods drawn at the fixed fallback");
  }
  if (invalidCount > 0) {
    notes.push(`${invalidCount} period entr${invalidCount === 1 ? "y" : "ies"} unreadable`);
  }
  return notes.join(" · ");
}

function buildDayStrip(s) {
  const { periods: rawPeriods, unavailable, malformed } = parsePeriodsToday(s.periods_today);
  if (unavailable) {
    const note = document.createElement("div");
    note.className = "strip-note";
    note.textContent = "period times unavailable";
    return note;
  }
  if (malformed) {
    const note = document.createElement("div");
    note.className = "strip-note";
    note.textContent = "period data unreadable";
    return note;
  }
  if (!rawPeriods.length) return null;

  const { valid: periods, invalidCount } = splitValidPeriods(rawPeriods);
  const note = stripNoteFor(periods, invalidCount);

  if (!periods.length) {
    // Every entry was unreadable: nothing left to draw a strip out of, but
    // that must still say so rather than looking exactly like "no periods
    // today" -- the same reasoning as the `unavailable`/`malformed` cases
    // above, just discovered one entry at a time instead of all at once.
    const el = document.createElement("div");
    el.className = "strip-note";
    el.textContent = note || "period data unreadable";
    return el;
  }

  const wrap = document.createElement("div");
  wrap.className = "strip-wrap";
  const strip = document.createElement("div");
  strip.className = "strip";

  for (const period of periods) {
    const isActive = period.name === s.period;
    for (const seg of bandSegments(period)) {
      const band = document.createElement("div");
      band.className = "band " + (period.mode === "off_only" ? "off_only" : "on_and_off") +
        (isActive ? " active" : "") + (period.approximate ? " approximate" : "");
      band.style.left = seg.startPct + "%";
      band.style.width = seg.widthPct + "%";
      band.title = `${period.name} ${period.from}–${period.to} · ${period.mode}` +
        (period.approximate ? " · approximate: sun unavailable, drawn at the fixed fallback" : "");
      if (seg.widthPct >= 12) {
        const label = document.createElement("span");
        label.className = "blabel";
        label.textContent = period.name;
        band.appendChild(label);
      }
      strip.appendChild(band);
    }
  }

  const now = new Date();
  const nowLine = document.createElement("div");
  nowLine.className = "now-line";
  nowLine.style.left = (((now.getHours() * 60 + now.getMinutes()) / MINUTES_PER_DAY) * 100) + "%";
  strip.appendChild(nowLine);

  wrap.appendChild(strip);
  const ticks = document.createElement("div");
  ticks.className = "ticks";
  for (const h of ["00", "06", "12", "18", "24"]) {
    const t = document.createElement("span");
    t.textContent = h;
    ticks.appendChild(t);
  }
  wrap.appendChild(ticks);

  if (note) {
    const noteEl = document.createElement("div");
    noteEl.className = "strip-note";
    noteEl.textContent = note;
    wrap.appendChild(noteEl);
  }

  return wrap;
}

// Returns { el, mismatchCount, unknownCount } so the caller can roll both up
// into the header ("N lights off target", "N lights unknown") without
// re-parsing desired_summary or re-resolving each device's actual state.
function buildLightsSection(s) {
  const { items: lightsArr, unparsedCount } = parseDesired(s.desired_summary);
  let mismatchCount = 0;
  let unknownCount = 0;

  const wrap = document.createElement("div");
  const label = document.createElement("div");
  label.className = "section-label";
  const labelText = document.createElement("span");
  labelText.textContent = "Lights";
  label.appendChild(labelText);
  const offTarget = document.createElement("span");
  offTarget.className = "off-target";
  label.appendChild(offTarget);
  const unknownNote = document.createElement("span");
  unknownNote.className = "off-unknown";
  label.appendChild(unknownNote);
  wrap.appendChild(label);

  const list = document.createElement("ul");
  list.className = "lights";
  for (const l of lightsArr) {
    const dev = deviceById[l.id];
    const isMismatch = mismatch(l.level, dev);
    if (isMismatch) mismatchCount++;
    if (l.level !== "leave" && actualState(dev).kind === "unknown") unknownCount++;

    const li = document.createElement("li");
    if (isMismatch) li.className = "mismatch";
    const dot = document.createElement("span");
    dot.className = "dot";
    const nm = document.createElement("span");
    nm.className = "lname";
    nm.textContent = lightName(l.id);
    const desired = document.createElement("span");
    desired.className = "ldesired";
    desired.textContent = levelLabel(l.level);
    const arrow = document.createElement("span");
    arrow.className = "larrow";
    arrow.textContent = "→";
    const actual = document.createElement("span");
    actual.className = "lactual";
    actual.textContent = l.level === "leave" ? "" : actualLabel(dev);

    li.appendChild(dot);
    li.appendChild(nm);
    li.appendChild(desired);
    // A row that is on target reads as one value; "off → off" is noise. The
    // arrow and actual appear only when the light disagrees with the zone.
    if (l.level !== "leave" && (isMismatch || desired.textContent !== actual.textContent)) {
      li.appendChild(arrow); li.appendChild(actual);
    }
    list.appendChild(li);
  }
  wrap.appendChild(list);

  // Both counts are degradation signals and both must show: a desired_summary
  // entry the page could not read is a light this card is silently missing.
  const notes = [];
  if (mismatchCount > 0) notes.push(`${mismatchCount} off target`);
  if (unparsedCount > 0) notes.push(`${unparsedCount} unparsed`);
  offTarget.textContent = notes.join(" · ");
  // A third, separate note: every light this card could not resolve at all
  // (actualState "unknown") is a whole row this card is silently blind to,
  // not merely off target — it gets its own amber note rather than being
  // folded into the red "off target" text, which would claim a comparison
  // this card was never able to make.
  unknownNote.textContent = unknownCount > 0 ? `${unknownCount} unknown` : "";
  return { el: wrap, mismatchCount, unknownCount };
}

// `raw` is `presence_inputs` from a zone's states, straight off the wire.
// `absent` (raw is null/undefined) is an OLDER plugin that never published
// this state at all -- the section is simply not there yet, not an error.
// `malformed` is a raw string this page received but could not parse -- a
// real degradation, distinct from both `absent` and a genuine "[]" (no
// inputs configured), and must not be swallowed into either.
function parsePresenceInputs(raw) {
  if (raw == null) return { inputs: [], malformed: false, absent: true };
  try {
    const parsed = JSON.parse(raw);
    return { inputs: Array.isArray(parsed) ? parsed : [], malformed: false, absent: false };
  } catch (_) {
    return { inputs: [], malformed: true, absent: false };
  }
}

function buildPresenceChips(s) {
  const { inputs, malformed, absent } = parsePresenceInputs(s.presence_inputs);
  if (absent) return null;
  if (malformed) {
    const note = document.createElement("div");
    note.className = "strip-note";
    note.textContent = "presence inputs unreadable";
    return note;
  }
  if (!inputs.length) return null;

  const wrap = document.createElement("div");
  const label = document.createElement("div");
  label.className = "section-label";
  label.textContent = "Presence inputs";
  wrap.appendChild(label);

  const row = document.createElement("div");
  row.className = "presence-row";
  for (const entry of inputs) {
    const chip = document.createElement("span");
    const cls = entry.on === true ? "on" : entry.on === false ? "off" : "unknown";
    chip.className = "pchip " + cls;
    chip.textContent = presenceInputLabel(entry) + (entry.last ? " " : "");
    if (entry.last) {
      const last = document.createElement("span");
      last.className = "last";
      last.textContent = "▲ last";
      chip.appendChild(last);
    }
    row.appendChild(chip);
  }
  wrap.appendChild(row);
  return wrap;
}

function buildFooter(dev, s) {
  const foot = document.createElement("div");
  foot.className = "foot";

  const disc = document.createElement("button");
  disc.className = "disclosure";
  disc.type = "button";
  const isOpen = openIds.has(String(dev.id));
  disc.setAttribute("aria-expanded", isOpen ? "true" : "false");
  disc.innerHTML = '<span class="tri">▸</span><span class="dlabel">Engine reasoning</span>';

  const explain = document.createElement("div");
  explain.className = "explain";
  explain.textContent = s.explain || "";
  explain.hidden = !isOpen;

  disc.addEventListener("click", () => {
    const nowOpen = explain.hidden;
    explain.hidden = !nowOpen;
    disc.setAttribute("aria-expanded", nowOpen ? "true" : "false");
    const key = String(dev.id);
    if (nowOpen) openIds.add(key); else openIds.delete(key);
  });

  const counters = document.createElement("div");
  counters.className = "counters";
  const wr = s.writes_today != null ? s.writes_today : 0;
  const ev = s.evaluations_today != null ? s.evaluations_today : 0;
  const ov = s.overrides_today != null ? s.overrides_today : 0;
  counters.textContent = `${wr} writes · ${ev} evals · ${ov} override${ov === 1 ? "" : "s"}`;

  foot.appendChild(disc);
  foot.appendChild(counters);
  foot.appendChild(explain);
  return foot;
}

// Returns { el, mismatchCount, unknownCount } — the caller sums both across
// every card for the header's "N lights off target" / "N lights unknown".
function buildCard(dev) {
  const hasStates = !!(dev.states && Object.keys(dev.states).length);
  const s = dev.states || {};
  const offFlag = isOff(dev);
  const card = document.createElement("div");
  card.className = "card" + (offFlag ? " disabled" : "");
  card.dataset.id = dev.id;

  card.appendChild(buildTitleRow(dev, s, offFlag));

  if (!hasStates) {
    // A zone device that hasn't finished starting has no states at all yet --
    // don't fabricate a period/lux/presence reading it never reported.
    const notice = document.createElement("div");
    notice.className = "verdict";
    notice.textContent = "no state reported (device not started?)";
    card.appendChild(notice);
    return { el: card, mismatchCount: 0, unknownCount: 0 };
  }

  const subline = buildOverrideSubline(s);
  if (subline) card.appendChild(subline);

  const verdict = document.createElement("div");
  verdict.className = "verdict";
  verdict.textContent = verdictFor(s, offFlag);
  card.appendChild(verdict);

  card.appendChild(buildFacts(s));

  const strip = buildDayStrip(s);
  if (strip) card.appendChild(strip);

  const { el: lightsEl, mismatchCount, unknownCount } = buildLightsSection(s);
  card.appendChild(lightsEl);

  const presenceEl = buildPresenceChips(s);
  if (presenceEl) card.appendChild(presenceEl);

  card.appendChild(buildFooter(dev, s));

  return { el: card, mismatchCount, unknownCount };
}

// Called on every successful poll (see `onPollOk`), payload and all. The
// non-array guard runs every time regardless of whether the payload changed
// -- a persistently malformed response must keep saying so, not just once.
// `lastRenderedJson` gates only the DOM rebuild below it.
function render(all) {
  if (!Array.isArray(all)) {
    showErr("Unexpected response from Indigo (not a device list)");
    lastRenderedJson = null;
    return;
  }

  const json = JSON.stringify(all);
  if (json === lastRenderedJson) return;
  lastRenderedJson = json;

  deviceNames = {};
  deviceById = {};
  for (const d of all) {
    deviceNames[String(d.id)] = d.name || ("#" + d.id);
    deviceById[String(d.id)] = d;
  }

  const zones = all.filter(d => d.pluginId === PLUGIN_ID && d.deviceTypeId === ZONE_TYPE);
  const ctrl = all.find(d => d.pluginId === PLUGIN_ID && d.deviceTypeId === CTRL_TYPE) || null;

  const grid = $("grid");
  const empty = $("empty");
  if (!zones.length) {
    grid.textContent = "";
    empty.hidden = false;
    renderHeader(ctrl, 0);
    return;
  }
  empty.hidden = true;

  // Attention order: overridden, occupied, vacant, off-duty, disabled; ties
  // by name (sortRank is pure and table-driven-tested on its own).
  zones.sort((a, b) => {
    const rankDiff = sortRank(a.states, isOff(a)) - sortRank(b.states, isOff(b));
    return rankDiff !== 0 ? rankDiff : zoneName(a).localeCompare(zoneName(b));
  });

  grid.textContent = "";
  let totalMismatches = 0;
  let totalUnknowns = 0;
  for (const z of zones) {
    const { el, mismatchCount, unknownCount } = buildCard(z);
    totalMismatches += mismatchCount;
    totalUnknowns += unknownCount;
    grid.appendChild(el);
  }
  renderHeader(ctrl, totalMismatches, totalUnknowns);
}

// Runs on every successful poll, changed or not, so the banner and the
// timestamp reflect that the connection is alive even when nothing in the
// device list moved (and `render`, called right after, may still redisplay
// a content error over top of the just-cleared banner).
function onPollOk() {
  if (authFailed) return;
  showErr("");
  $("updated").textContent = "updated " + fmtClock(new Date());
}

async function init() {
  if (typeof IndigoAPI === "undefined" || !IndigoAPI.isConfigured()) {
    showErr("Not connected to Indigo. Open this page from the Indigo server or the dom.io app.");
    return;
  }
  indigo = new IndigoAPI();
  indigo.onError(e => {
    if (authFailed) return;
    lastRenderedJson = null; // so the next success is a full rebuild, not a no-op diff
    showErr("Indigo error: " + e.message);
  });
  indigo.onAuthFailure(() => {
    authFailed = true;
    if (watcher) { watcher.stop(); watcher = null; }
    showErr("Authentication failed — reload the page with a valid ?api-key=");
  });
  watcher = indigo.observeAll(render, 5000, onPollOk);
}

init();
</script>
</body>
