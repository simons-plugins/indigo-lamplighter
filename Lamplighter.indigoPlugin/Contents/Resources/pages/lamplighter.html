<body>
<div class="wrap">
<h1>Lamplighter</h1>
<div class="updated" id="updated"></div>
<div id="err" class="banner bad"></div>

<div class="hdr" id="hdr" hidden></div>
<div class="legend" id="legend" hidden>
  <span class="lg-item"><span class="lg-swatch presence"></span>Presence (thin ticks are presence-input edges)</span>
  <span class="lg-item"><span class="lg-swatch light"></span>Light (deeper = brighter; thin ticks are commanded writes)</span>
  <span class="lg-item"><span class="lg-swatch override"></span>Override</span>
  <span class="lg-item"><span class="lg-swatch bright"></span>☀ Bright, so off duty (for as long as the bar runs)</span>
  <span class="lg-item" style="color:var(--bad)">⋯ History truncated</span>
  <span class="lg-item"><span class="lg-swatch now"></span>Now</span>
</div>

<div id="empty" class="empty" hidden>No Lamplighter zones found.</div>
<div class="grid" id="grid"></div>
</div>

<script>
// -- indigo-api.js V1, inlined (pages must be self-contained) and modified: read-only, observe()/observeAll() call back on every fetch and take an onOk hook -- see the comments on observe(). --
class IndigoAPI {
    constructor(config) {
        const cfg = config || window.INDIGO_CONFIG || IndigoAPI._configFromURL();
        if (!cfg || !cfg.baseURL || !cfg.apiKey) {
            this._configured = false;
            this._showConfigError();
            return;
        }
        this._configured = true;
        this._baseURL = cfg.baseURL.replace(/\/+$/, "");
        this._apiKey = cfg.apiKey;
        this._errorHandler = null;
        this._authFailureHandler = null;
    }

    static isConfigured() {
        const cfg = window.INDIGO_CONFIG || IndigoAPI._configFromURL();
        return !!(cfg && cfg.baseURL && cfg.apiKey);
    }

    static _configFromURL() {
        if (typeof location === "undefined") return null;
        const params = new URLSearchParams(location.search);
        const apiKey = params.get("api-key");
        if (!apiKey) return null;
        return { baseURL: location.origin, apiKey };
    }

    async getDevices() {
        return this._getList("/v2/api/indigo.devices");
    }

    async getDevice(id) {
        return this._get(`/v2/api/indigo.devices/${id}`);
    }

    // The timeline's data source (PRD section 12). A plain static asset, not
    // a `/v2/api/...` route, so a missing or malformed file is a normal
    // fetch failure the caller handles the same way as any other -- see
    // `pollHistoryOnce()` below, which never lets it block the device poll.
    // `tolerantJson`: Indigo may serve this .json file with a text/plain
    // Content-Type, and this endpoint must still read it as JSON when it does.
    async getHistory() {
        // IWS (and the Reflector in front of it) serve static files with
        // `cache-control: public, max-age=86400`, so without a cache-buster
        // the browser would happily show yesterday's history for a day. The
        // query string defeats the URL cache; `no-store` tells the browser
        // not to keep this response either.
        return this._fetch(`/static/pages/lamplighter-history.json?t=${Date.now()}`,
            { method: "GET", tolerantJson: true, cache: "no-store" });
    }

    // Read-only page: this class keeps the shared IndigoAPI shape from the
    // skill reference, but the command helpers (turnOn/setBrightness/etc.)
    // are intentionally omitted — Lamplighter status never sends commands.

    // Self-scheduling: the next poll is only queued once the current one has
    // settled (in `finally`), so a slow endpoint cannot stack overlapping
    // requests or deliver them out of order. `callback` runs on every
    // successful fetch, raw payload and all; `onOk`, when given, also runs on
    // every successful fetch, before `callback` -- callers use it for things
    // like an "updated" timestamp or clearing a transport error banner, kept
    // separate so `callback` is free to do its own diffing for a DOM rebuild
    // without that diff swallowing onOk's per-poll bookkeeping.
    observe(deviceId, callback, intervalMs = 5000, onOk = null) {
        return this._pollLoop(() => this.getDevice(deviceId), callback, intervalMs, onOk);
    }

    observeAll(callback, intervalMs = 5000, onOk = null) {
        return this._pollLoop(() => this.getDevices(), callback, intervalMs, onOk);
    }

    _pollLoop(fetchFn, callback, intervalMs, onOk) {
        let stopped = false;
        let timer = null;
        const poll = async () => {
            try {
                const result = await fetchFn();
                if (onOk) { try { onOk(result); } catch (_) { /* caller's problem, not ours */ } }
                callback(result);
            } catch (err) {
                this._handleError(err);
            } finally {
                if (!stopped) timer = setTimeout(poll, intervalMs);
            }
        };
        poll();
        return { stop: () => { stopped = true; if (timer !== null) clearTimeout(timer); } };
    }

    onError(callback) {
        this._errorHandler = callback;
    }

    onAuthFailure(callback) {
        this._authFailureHandler = callback;
    }

    async _get(path) {
        return this._fetch(path, { method: "GET" });
    }

    async _getList(path) {
        return this._fetch(path, { method: "GET" });
    }

    async _fetch(path, options = {}) {
        this._requireConfigured();

        // `tolerantJson` is this class's own option, not a `fetch()` one --
        // pulled out before spreading `options` into the request below so it
        // never reaches the network layer as a bogus init field.
        const { tolerantJson, ...fetchOptions } = options;
        const url = `${this._baseURL}${path}`;
        const headers = {
            Authorization: `Bearer ${this._apiKey}`,
            Accept: "application/json",
            ...fetchOptions.headers,
        };

        let response;
        try {
            response = await fetch(url, { ...fetchOptions, headers });
        } catch (err) {
            const error = new IndigoAPIError("Network error: " + err.message, 0, err);
            this._handleError(error);
            throw error;
        }

        if (response.status === 401 || response.status === 403) {
            const error = new IndigoAPIError(
                "Authentication failed — check your API key",
                response.status
            );
            if (this._authFailureHandler) this._authFailureHandler(error);
            this._handleError(error);
            throw error;
        }

        if (!response.ok) {
            const text = await response.text().catch(() => "");
            const error = new IndigoAPIError(
                `HTTP ${response.status}: ${text || response.statusText}`,
                response.status
            );
            this._handleError(error);
            throw error;
        }

        const contentType = response.headers.get("Content-Type") || "";
        if (!contentType.includes("json")) {
            if (!tolerantJson) return null;
            // Indigo may serve a plain static file (like the history JSON)
            // with a Content-Type of text/plain rather than
            // application/json -- `tolerantJson` callers still want the
            // parsed object rather than being told there was nothing here.
            const text = await response.text().catch(() => "");
            try {
                return JSON.parse(text);
            } catch (err) {
                const error = new IndigoAPIError("Invalid JSON response", response.status, err);
                this._handleError(error);
                throw error;
            }
        }

        try {
            return await response.json();
        } catch (err) {
            const error = new IndigoAPIError("Invalid JSON response", response.status, err);
            this._handleError(error);
            throw error;
        }
    }

    _requireConfigured() {
        if (!this._configured) {
            throw new IndigoAPIError(
                "IndigoAPI is not configured — window.INDIGO_CONFIG is missing or incomplete",
                0
            );
        }
    }

    _handleError(error) {
        if (this._errorHandler) {
            try { this._errorHandler(error); } catch (_) { /* prevent handler errors from cascading */ }
        }
    }

    _showConfigError() {
        if (typeof document === "undefined") return;
        const banner = document.createElement("div");
        banner.id = "indigo-config-error";
        banner.style.cssText =
            "position:fixed;top:0;left:0;right:0;padding:12px 16px;" +
            "background:#dc3545;color:#fff;font:14px/1.4 -apple-system,sans-serif;" +
            "text-align:center;z-index:99999;";
        banner.textContent = "Indigo connection not configured. Set window.INDIGO_CONFIG or add ?api-key= to the URL.";
        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", () => document.body.prepend(banner));
        } else {
            document.body.prepend(banner);
        }
    }
}

class IndigoAPIError extends Error {
    constructor(message, status, cause) {
        super(message);
        this.name = "IndigoAPIError";
        this.status = status;
        if (cause) this.cause = cause;
    }
}
</script>
<script>
// ── page logic ──────────────────────────────────────────────────────────
const PLUGIN_ID = "com.simons-plugins.indigo-lamplighter";
const ZONE_TYPE = "lamplighter_zone";
const CTRL_TYPE = "lamplighter_controller";
const NAME_PREFIX = /^Lamplighter - /;
const MINUTES_PER_DAY = 1440;
const MANUAL_LOCK_DEVICE_ID = "-1";

const $ = id => document.getElementById(id);
let indigo = null, watcher = null;
let openIds = new Set();         // disclosures the user has opened, kept open across re-renders
let deviceNames = {};            // id -> name, rebuilt whenever render() rebuilds the DOM (payload changed)
let deviceById = {};             // id -> full device object, for reading actual state (brightness/onState)
let lastRenderedJson = null;     // gates the DOM rebuild only; reset to null on any error so the next success rebuilds -- see render()
let authFailed = false;

function showErr(msg) {
  const el = $("err");
  el.textContent = msg;
  el.classList.toggle("show", !!msg);
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "";
  return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

function fmtClock(d) {
  return d.toLocaleTimeString([], { hour12: false });
}

function zoneName(dev) {
  return (dev.name || "").replace(NAME_PREFIX, "");
}

// A device's on/off arrives at the top level as `onState` over the REST API;
// `onOffState` only exists inside `states`. A zone that is off is disabled.
// The `states.onOffState` fallback covers a payload that omits `onState` (a
// device still starting); it deliberately never overrides a present `onState`.
function isOff(dev) {
  if (dev.onState === false) return true;
  const st = dev.states || {};
  return dev.onState == null && st.onOffState === false;
}

// ── parsing helpers (pure — table-driven-tested under node) ─────────────

function parseDesired(summary) {
  // "144694384=100, 772478931=50, ..." -> { items: [{id, level}], unparsedCount }
  if (typeof summary !== "string" || !summary) return { items: [], unparsedCount: 0 };
  const items = [];
  let unparsedCount = 0;
  for (const pair of summary.split(",").map(p => p.trim()).filter(Boolean)) {
    const eq = pair.indexOf("=");
    const id = eq < 0 ? "" : pair.slice(0, eq).trim();
    if (eq < 0 || !id) { unparsedCount++; continue; }
    items.push({ id, level: pair.slice(eq + 1).trim() });
  }
  return { items, unparsedCount };
}

function levelLabel(level) {
  if (level === "leave") return "left alone";
  if (level === "off") return "off";
  if (level === "on") return "on";
  const n = parseInt(level, 10);
  if (!isNaN(n) && String(n) === level) return n + " %";
  return level;
}

function isNumericLevel(level) {
  const n = parseInt(level, 10);
  return !isNaN(n) && String(n) === String(level);
}

// Does this desired level mean "the light should be showing some light at
// all"? Used by verdictFor() to decide between "nothing to switch" and
// "lights at X levels", and between plain "off" and "dimmed to vacant
// levels" — the same question in both states, just a different period plan.
function levelIsOnish(level) {
  if (level === "on") return true;
  if (isNumericLevel(level)) return parseInt(level, 10) > 0;
  return false;
}

// This device's actual state, read the same way for every desired level:
// { kind: "dimmer"|"relay"|"unknown", on, brightness }. `brightness` is only
// meaningful for a dimmer. A device absent from the device list (gone, or a
// lookup that failed — the zone's explain lists it under "unavailable
// lights") reads "unknown" rather than guessing at "off", which would hide
// the very degradation R15 asks every part of this plugin to say out loud.
// A device that IS in the payload but carries no on/off reading at all
// (`onState` absent at the top level and `states.onOffState` absent too —
// still starting, or a payload shape this page has not seen) is the same
// kind of blank: it is not "off", it is "nothing read yet".
function actualState(dev) {
  if (!dev) return { kind: "unknown" };
  if (dev.onState == null && (dev.states || {}).onOffState == null) return { kind: "unknown" };
  if (typeof dev.brightness === "number") {
    return { kind: "dimmer", on: !!dev.onState, brightness: dev.onState ? dev.brightness : 0 };
  }
  return { kind: "relay", on: isOff(dev) ? false : !!dev.onState };
}

function actualLabel(dev) {
  const st = actualState(dev);
  if (st.kind === "unknown") return "unknown";
  if (st.kind === "dimmer") return st.on ? `${st.brightness} %` : "off";
  return st.on ? "on" : "off";
}

// Is `desiredLevel` for this device visibly different from what it is
// actually doing right now? `"leave"` (the plugin never writes this device)
// and an unresolved device (nothing to compare against) never mismatch —
// see actualState() above on why an unknown must not read as a mismatch.
function mismatch(desiredLevel, actualDevice) {
  if (desiredLevel == null || desiredLevel === "leave") return false;
  const st = actualState(actualDevice);
  if (st.kind === "unknown") return false;

  if (desiredLevel === "off") return st.kind === "dimmer" ? st.brightness > 0 : st.on === true;
  if (desiredLevel === "on") return st.kind === "dimmer" ? st.brightness <= 0 : st.on === false;
  if (isNumericLevel(desiredLevel)) {
    const target = parseInt(desiredLevel, 10);
    if (st.kind !== "dimmer") return (target > 0) !== st.on;
    return !levelMatches(st.brightness, target);
  }
  return false;
}

// The engine's own R5 tolerance (compare.level_matches), ported verbatim so
// the red dot never contradicts what the plugin will actually rewrite: a
// band of max(1, ceil(10 % of target)) either side, with 0 and 100 exact.
// A flat ±3 here would flag a group dimmer reading 46 for 50 that the
// plugin has (rightly) left alone, and miss a 13 for 10 that it is chasing.
function levelMatches(actual, target) {
  if (target <= 0 || target >= 100) return actual === target;
  return Math.abs(actual - target) <= Math.max(1, Math.ceil(target * 0.10));
}

// The lane label column is narrow, and every light in a zone tends to carry
// the zone's name ("Kitchen Pendants"): drop that prefix (and a following
// separator) before truncating, so "Pendants" survives where "Kitchen Pen…"
// told the reader nothing.
function laneLabel(name, zone) {
  let label = String(name || "");
  if (zone) {
    // Space-insensitive: "DiningRoom - Shelves" in the "Dining Room" zone.
    const letters = String(zone).replace(/\s+/g, "").split("")
      .map(c => c.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\s*").join("");
    // The prefix must end at a word boundary: "Kitchenette Lamp" in the
    // Kitchen zone keeps its name rather than becoming "ette Lamp".
    const match = label.match(new RegExp("^" + letters + "(?![A-Za-z0-9])[\\s\\-–—:·]*", "i"));
    if (match) label = label.slice(match[0].length);
  }
  if (!label) label = String(name || "");
  return label.length > 18 ? label.slice(0, 17) + "…" : label;
}

function lightName(id) {
  return deviceNames[id] || ("#" + id);
}

// "HH:MM" -> minutes since local midnight. Never throws: a value that will
// not parse reads as 0 rather than NaN poisoning the band's position.
function timeToMinutes(hhmm) {
  const m = /^([0-9]{1,2}):([0-9]{2})$/.exec(String(hhmm || ""));
  if (!m) return 0;
  return (parseInt(m[1], 10) * 60 + parseInt(m[2], 10)) % MINUTES_PER_DAY;
}

// One period's { from, to } (both "HH:MM") as one or two horizontal bar
// segments, each `{ startPct, widthPct }` of the 24-hour strip. Two segments
// come out when `to <= from` — the period crosses midnight (periods_today
// publishes it exactly that way; see zone.py's `_periods_today_json`) — so
// the wrap always draws as an end-of-day piece plus a start-of-day piece
// rather than one backwards or one full-width band.
function bandSegments(period) {
  const from = timeToMinutes(period.from);
  const to = timeToMinutes(period.to);
  if (to > from) {
    return [{ startPct: (from / MINUTES_PER_DAY) * 100, widthPct: ((to - from) / MINUTES_PER_DAY) * 100 }];
  }
  const segments = [];
  if (from < MINUTES_PER_DAY) {
    segments.push({ startPct: (from / MINUTES_PER_DAY) * 100, widthPct: ((MINUTES_PER_DAY - from) / MINUTES_PER_DAY) * 100 });
  }
  if (to > 0) {
    segments.push({ startPct: 0, widthPct: (to / MINUTES_PER_DAY) * 100 });
  }
  return segments;
}

// ── timeline pure helpers (PRD section 12) ───────────────────────────────
// Every function below is pure, table-tested (test_web_page_js.py), and
// works in millisecond epoch time on [start, end) half-open intervals, so
// `unionIntervals`/`intersectIntervals`/`subtractIntervals` can share one
// representation with `intervalsFromStates`/`levelIntervals`, which is what
// `statsFor` actually needs -- a stat is nothing but interval arithmetic on
// the same two questions the lanes already answer: "when was X true".

// This date's position in [0, 100] of the 24 h window starting at `dayStart`.
// Clamped: a `date` before dayStart or at/after the next midnight reads as
// the nearest edge (0 or 100, both inclusive) rather than a negative or
// >100 value that would push a mark off the drawn frame.
function pctOfDay(date, dayStart) {
  const dayMs = 24 * 60 * 60 * 1000;
  const pct = ((date.getTime() - dayStart.getTime()) / dayMs) * 100;
  return Math.max(0, Math.min(100, pct));
}

// One zone's `state` events -> { occupied: [[startMs,endMs],...], overridden: [...] }
// clipped to [dayStart, now]. The state in force AT dayStart is carried in
// from the last `state` event at or before it (which may be from yesterday,
// since history keeps 48h) -- a zone that has been occupied since 23:40
// last night must show occupied from 00:00, not from whenever today's first
// event happens to land.
// Off duty because the room is bright is a STRETCH of time, not an instant:
// it starts at the `offduty` event with cause "bright" and lasts until the
// next `state` event of any kind (the zone came back, or went off duty for
// a different reason). Drawn as a span so it is not mistaken for a one-off.
// `[{start, end}]` in ms; `end` is null while the stretch is still running.
function brightSpans(events) {
  const timed = (events || [])
    .filter(e => e && typeof e.t === "string")
    .map(e => ({ e, ms: new Date(e.t).getTime() }))
    .filter(x => !isNaN(x.ms))
    .sort((a, b) => a.ms - b.ms);
  const spans = [];
  for (let i = 0; i < timed.length; i++) {
    const { e, ms } = timed[i];
    if (e.k !== "offduty" || e.cause !== "bright") continue;
    let end = null;
    for (let j = i + 1; j < timed.length; j++) {
      if (timed[j].e.k === "state" && timed[j].ms > ms) { end = timed[j].ms; break; }
    }
    spans.push({ start: ms, end });
  }
  return spans;
}

function intervalsFromStates(events, dayStart, now) {
  const dayStartMs = dayStart.getTime();
  const nowMs = now.getTime();
  const stateEvents = (events || [])
    .filter(e => e && e.k === "state" && typeof e.t === "string" && typeof e.to === "string")
    .map(e => ({ t: new Date(e.t).getTime(), to: e.to }))
    .filter(e => !isNaN(e.t))
    .sort((a, b) => a.t - b.t);

  let state = null;
  let idx = 0;
  while (idx < stateEvents.length && stateEvents[idx].t <= dayStartMs) {
    state = stateEvents[idx].to;
    idx++;
  }

  const occupied = [];
  const overridden = [];
  let segStart = dayStartMs;
  const closeSeg = endMs => {
    if (endMs <= segStart) return;
    if (state === "occupied") occupied.push([segStart, endMs]);
    else if (state === "overridden") overridden.push([segStart, endMs]);
  };
  for (; idx < stateEvents.length; idx++) {
    const ev = stateEvents[idx];
    if (ev.t > nowMs) break;
    closeSeg(ev.t);
    state = ev.to;
    segStart = ev.t;
  }
  closeSeg(nowMs);
  return { occupied, overridden };
}

// One device's `light` events -> [[startMs, endMs, level], ...] where
// level > 0, clipped to [dayStart, now]. The level in force AT dayStart is
// resolved from `events` itself -- the last `light` event at or before it,
// which may be from yesterday, since history keeps 48h -- exactly the way
// `intervalsFromStates` resolves the state in force at midnight above.
// There is no separate carry-in parameter: every caller has always passed
// the full 48h of events and let this function work it out, so a
// `carryIn` argument here was dead weight, not a real second way to call
// this. Before the very first event of all, the level is genuinely
// unknown, in which case nothing is drawn until it arrives -- an unknown
// start must not default to "off", which would claim a fact nobody has.
function levelIntervals(events, deviceId, dayStart, now) {
  const dayStartMs = dayStart.getTime();
  const nowMs = now.getTime();
  const lightEvents = (events || [])
    .filter(e => e && e.k === "light" && e.id === deviceId && typeof e.t === "string")
    .map(e => ({ t: new Date(e.t).getTime(), level: e.level }))
    .filter(e => !isNaN(e.t))
    .sort((a, b) => a.t - b.t);

  let level = null;
  let idx = 0;
  while (idx < lightEvents.length && lightEvents[idx].t <= dayStartMs) {
    level = lightEvents[idx].level;
    idx++;
  }

  const intervals = [];
  let segStart = dayStartMs;
  const closeSeg = endMs => {
    if (endMs <= segStart) return;
    if (typeof level === "number" && level > 0) intervals.push([segStart, endMs, level]);
  };
  for (; idx < lightEvents.length; idx++) {
    const ev = lightEvents[idx];
    if (ev.t > nowMs) break;
    closeSeg(ev.t);
    level = typeof ev.level === "number" ? ev.level : level;
    segStart = ev.t;
  }
  closeSeg(nowMs);
  return intervals;
}

// Merges overlapping/adjacent [start,end,...] intervals into the fewest
// disjoint [start,end] pairs, sorted by start. A third element (light level)
// is intentionally dropped -- a union answers "when was ANY of these true",
// which has no single level once two lights' intervals merge.
function unionIntervals(list) {
  const sorted = (list || []).map(iv => [iv[0], iv[1]]).sort((a, b) => a[0] - b[0]);
  const out = [];
  for (const iv of sorted) {
    if (iv[1] <= iv[0]) continue;
    const last = out[out.length - 1];
    if (last && iv[0] <= last[1]) last[1] = Math.max(last[1], iv[1]);
    else out.push([iv[0], iv[1]]);
  }
  return out;
}

// The overlap of two interval lists, as disjoint [start,end] pairs. Neither
// input needs to be pre-unioned; both are sorted internally, which is what
// keeps the sweep below linear rather than quadratic.
function intersectIntervals(a, b) {
  const A = unionIntervals(a);
  const B = unionIntervals(b);
  const out = [];
  let i = 0, j = 0;
  while (i < A.length && j < B.length) {
    const start = Math.max(A[i][0], B[j][0]);
    const end = Math.min(A[i][1], B[j][1]);
    if (start < end) out.push([start, end]);
    if (A[i][1] < B[j][1]) i++; else j++;
  }
  return out;
}

// `a` with every interval of `b` removed, as disjoint [start,end] pairs.
function subtractIntervals(a, b) {
  const bUnion = unionIntervals(b);
  const out = [];
  for (const iv of unionIntervals(a)) {
    let start = iv[0];
    const end = iv[1];
    for (const bIv of bUnion) {
      if (bIv[1] <= start) continue;
      if (bIv[0] >= end) break;
      if (bIv[0] > start) out.push([start, bIv[0]]);
      start = Math.max(start, bIv[1]);
    }
    if (start < end) out.push([start, end]);
  }
  return out;
}

// Total minutes covered by a list of [start,end,...] intervals (ms epoch).
// Never NaN: an empty list is 0 minutes, not a reduce() over nothing.
function minutesOf(intervals) {
  return (intervals || []).reduce((sum, iv) => sum + Math.max(0, iv[1] - iv[0]) / 60000, 0);
}

// The stats row under one zone's timeline, from its raw event list. Pure,
// so the table under it can pin every definition without a DOM. `lightIds`
// is the zone's lights in desired_summary order; each is read with no
// carry-in -- `levelIntervals` resolves its own carry-in from `events`
// itself now, there is no separate parameter to pass one through ("here
// with lights off" / "on while empty" degrade to "unknown before the
// first report today reads as off", which is the conservative direction
// for a household reading these as facts to act on). `unknownLights` is
// every id in `lightIds` with no `light` event anywhere in `events` at
// all (typically the full 48h window, not just today) -- the caller shows
// that count so "0 lights on, 0 overrides" cannot be mistaken for a zone
// this page has never actually heard a light report from. When `lightIds`
// is empty, every light-DEPENDENT figure is `null` rather than a
// misleading 0 -- "no lights configured" and "lights configured but
// quiet" are different facts and must not render the same number.
function statsFor(zoneEvents, lightIds, dayStart, now) {
  const events = zoneEvents || [];
  const ids = lightIds || [];
  const { occupied, overridden } = intervalsFromStates(events, dayStart, now);
  const occUnion = unionIntervals(occupied);
  const overUnion = unionIntervals(overridden);

  const dayStartMs = dayStart.getTime();
  const nowMs = now.getTime();
  const overrideStarts = events.filter(e => {
    if (!e || e.k !== "override" || e.phase !== "start") return false;
    const t = new Date(e.t).getTime();
    return !isNaN(t) && t >= dayStartMs && t <= nowMs;
  }).length;

  if (!ids.length) {
    return {
      occupiedMinutes: minutesOf(occUnion),
      lightsOnMinutes: null,
      onWhileEmptyMinutes: null,
      hereLightsOffMinutes: null,
      overrideCount: overrideStarts,
      cycles: null,
      unknownLights: [],
    };
  }

  const perLight = ids.map(id => levelIntervals(events, id, dayStart, now));
  const anyLight = unionIntervals(perLight.flat());
  const onWhileEmpty = subtractIntervals(subtractIntervals(anyLight, occUnion), overUnion);
  const hereLightsOff = subtractIntervals(occUnion, anyLight);
  const unknownLights = ids.filter(id => !events.some(e => e && e.k === "light" && e.id === id));

  return {
    occupiedMinutes: minutesOf(occUnion),
    lightsOnMinutes: minutesOf(anyLight),
    onWhileEmptyMinutes: minutesOf(onWhileEmpty),
    hereLightsOffMinutes: minutesOf(hereLightsOff),
    overrideCount: overrideStarts,
    // A rising edge per disjoint "any light on" block -- the union already
    // collapsed overlapping/adjacent intervals, so its length IS the cycle
    // count with no separate edge-detection pass needed. A light already on
    // AT dayStart (carried in from before midnight, same as `intervalsFromStates`
    // above) starts its block right at dayStart rather than at a rising edge
    // that happened yesterday, and still counts as exactly one cycle here --
    // there is no true "rising edge" inside today's window for it.
    cycles: anyLight.length,
    unknownLights,
  };
}

// Sort key for "attention order": overridden first, then occupied, vacant,
// off-duty, disabled; anything with no state yet after that — ties broken by
// name at the call site. Table-driven-tested directly against the (states,
// isOffFlag) inputs render() already has on hand, rather than against a
// whole device object.
function sortRank(states, isOffFlag) {
  if (isOffFlag) return 4;
  switch ((states || {}).state) {
    case "overridden": return 0;
    case "occupied": return 1;
    case "vacant": return 2;
    case "off_duty": return 3;
    default: return 5; // no states yet / unrecognised — after disabled, per the comment above
  }
}

// The chip: label and CSS class, for any zone state.
function chipFor(states, isOffFlag) {
  if (isOffFlag) return { cls: "disabled", label: "DISABLED" };
  const s = states || {};
  switch (s.state) {
    case "occupied": return { cls: "occupied", label: "OCCUPIED" };
    case "vacant": return { cls: "vacant", label: "VACANT" };
    case "overridden": {
      const until = fmtTime(s.override_expires);
      return { cls: "overridden", label: "OVERRIDDEN" + (until ? " · until " + until : "") };
    }
    case "off_duty": {
      const causeText = { bright: " · bright", no_period: " · no period", disabled: " · disabled" }[s.off_duty_cause] || "";
      return { cls: "offduty", label: "OFF DUTY" + causeText };
    }
    default: return { cls: "vacant", label: (s.state || "UNKNOWN").toUpperCase() };
  }
}

// The one-sentence verdict: the most prominent text on the card, built only
// from states and the device list — never from parsing `explain`'s prose,
// which is what the 2026.3.0 card used to do.
function verdictFor(states, isOffFlag) {
  if (isOffFlag) return "Zone switched off in Indigo.";
  const s = states || {};
  const { items } = parseDesired(s.desired_summary);
  const anyOnish = items.some(it => levelIsOnish(it.level));
  const period = s.period || "";

  switch (s.state) {
    case "occupied":
      return anyOnish
        ? `Someone is here — lights at ${period || "this period's"} levels.`
        : `Someone is here — nothing to switch in ${period || "this period"}.`;
    case "vacant": {
      const since = fmtTime(s.presence_last_seen);
      return anyOnish
        ? `Empty${since ? " since " + since : ""} — lights dimmed to vacant levels.`
        : `Empty${since ? " since " + since : ""} — lights off.`;
    }
    case "overridden": {
      const until = fmtTime(s.override_expires);
      return `Changed by hand — holding whatever the lights are now until ${until || "it expires"}.`;
    }
    case "off_duty":
      switch (s.off_duty_cause) {
        case "bright": {
          const n = (s.lux !== "" && s.lux != null) ? Math.round(parseFloat(s.lux)) : NaN;
          return `Bright enough${!isNaN(n) ? ` (${n} lx)` : ""} — lights left off.`;
        }
        case "no_period": return "No period covers now — lights left alone.";
        case "disabled": return "Zone disabled — lights left alone.";
        default: return "Off duty — lights left alone.";
      }
    default: return "";
  }
}

function presenceFact(s) {
  if (s.presence_active === true) return "here";
  if (s.presence_last_seen) return "last seen " + fmtTime(s.presence_last_seen);
  return "never";
}

function lightFact(s) {
  const dark = s.dark === true;
  const label = s.dark == null ? "" : (dark ? "dark" : "bright");
  if (s.lux !== "" && s.lux != null) {
    const n = Math.round(parseFloat(s.lux));
    if (!isNaN(n)) return label ? `${n} lx · ${label}` : `${n} lx`;
  }
  return label || "unknown";
}

function overrideOwnerLabel(s) {
  if (s.override_device === "" || s.override_device == null) return "";
  return String(s.override_device) === MANUAL_LOCK_DEVICE_ID ? "manual lock" : lightName(String(s.override_device));
}

function overrideFact(s) {
  const owner = overrideOwnerLabel(s);
  if (!owner) return "none";
  const until = fmtTime(s.override_expires);
  return until ? `${owner} until ${until}` : owner;
}

// Minutes remaining until `expiresIso`, recomputed fresh at call time so it
// stays honest across a 5-second poll interval without the server sending
// a new value. null when there is nothing to count down (no override, or an
// unparseable timestamp) rather than a made-up 0.
function minutesLeft(expiresIso, now = new Date()) {
  if (!expiresIso) return null;
  const exp = new Date(expiresIso);
  if (isNaN(exp.getTime())) return null;
  return Math.max(0, Math.round((exp.getTime() - now.getTime()) / 60000));
}

function presenceInputLabel(entry) {
  if (entry.kind === "device") return lightName(String(entry.id));
  if (entry.name) return "var " + String(entry.name).replace(/^variable /, "");
  return "var " + entry.id;
}

// `parts` is a mix of plain strings (rendered as text) and
// { text, style } objects (rendered inside a <b>) -- never raw HTML, since
// `config_status` in particular is free-form text from the loader that may
// echo back content of the config file.
function addParts(hdr, parts) {
  const span = document.createElement("span");
  for (const part of parts) {
    if (typeof part === "string") {
      span.appendChild(document.createTextNode(part));
      continue;
    }
    const b = document.createElement("b");
    if (part.style) b.style.cssText = part.style;
    b.textContent = part.text;
    span.appendChild(b);
  }
  hdr.appendChild(span);
}

function renderHeader(ctrl, offTargetCount, unknownCount = 0) {
  const hdr = $("hdr");
  if (!ctrl) { hdr.hidden = true; return; }
  const s = ctrl.states || {};
  hdr.hidden = false;
  hdr.textContent = "";
  addParts(hdr, [{
    text: isOff(ctrl) ? "Disabled" : "Enabled",
    style: isOff(ctrl) ? "color:var(--bad)" : "color:var(--on-color)",
  }]);
  const total = s.zones != null ? s.zones : "?";
  const enabled = s.zones_enabled != null ? s.zones_enabled : "?";
  const overridden = s.zones_overridden != null ? s.zones_overridden : 0;
  addParts(hdr, [
    { text: String(total) }, " zones (", { text: String(enabled) }, " enabled, ",
    { text: String(overridden) }, " overridden)",
  ]);
  if (offTargetCount > 0) {
    addParts(hdr, [{ text: `${offTargetCount} light${offTargetCount === 1 ? "" : "s"} off target`, style: "color:var(--bad)" }]);
  }
  // A separate, amber note: these lights were never compared at all (no
  // on/off reading to compare against), which must not read as silence —
  // an all-unknown zone would otherwise show 0 off target and look fine.
  if (unknownCount > 0) {
    addParts(hdr, [{ text: `${unknownCount} light${unknownCount === 1 ? "" : "s"} unknown`, style: "color:var(--warn)" }]);
  }
  if (s.config_status) addParts(hdr, ["config: ", { text: s.config_status }]);
  const ev = s.evaluations_today != null ? s.evaluations_today : 0;
  const wr = s.writes_today != null ? s.writes_today : 0;
  const ov = s.overrides_today != null ? s.overrides_today : 0;
  addParts(hdr, [
    "today: ", { text: String(wr) }, " writes · ", { text: String(ev) }, " evals · ",
    { text: String(ov) }, " overrides",
  ]);
  if (s.config_loaded_at) addParts(hdr, ["loaded " + fmtTime(s.config_loaded_at)]);
}

// ── card sections ─────────────────────────────────────────────────────

function buildTitleRow(dev, s, offFlag) {
  const crow = document.createElement("div");
  crow.className = "crow";
  const nameEl = document.createElement("div");
  nameEl.className = "zname";
  nameEl.textContent = zoneName(dev);
  const chipInfo = chipFor(s, offFlag);
  const chipEl = document.createElement("span");
  chipEl.className = "chip " + chipInfo.cls;
  chipEl.textContent = chipInfo.label;
  crow.appendChild(nameEl);
  crow.appendChild(chipEl);
  return crow;
}

function buildOverrideSubline(s) {
  if (s.state !== "overridden") return null;
  const owner = overrideOwnerLabel(s);
  const since = fmtTime(s.persist_override_since);
  const left = minutesLeft(s.override_expires);
  const parts = [];
  if (owner) parts.push(`taken by ${owner}`);
  if (since) parts.push(`at ${since}`);
  if (left != null) parts.push(`${left} min left`);
  if (!parts.length) return null;
  const div = document.createElement("div");
  div.className = "subline";
  div.textContent = parts.join(" · ");
  return div;
}

function buildFacts(s) {
  const facts = document.createElement("div");
  facts.className = "facts";
  const rows = [
    ["Period", s.period || "none"],
    ["Light", lightFact(s)],
    ["Presence", presenceFact(s)],
    ["Override", overrideFact(s)],
  ];
  for (const [label, value] of rows) {
    const cell = document.createElement("div");
    const lbl = document.createElement("div");
    lbl.className = "fact-label";
    lbl.textContent = label;
    const val = document.createElement("div");
    val.className = "fact-value";
    val.textContent = value;
    cell.appendChild(lbl);
    cell.appendChild(val);
    facts.appendChild(cell);
  }
  return facts;
}

function parsePeriodsToday(raw) {
  if (raw === "unavailable" || raw === "" || raw == null) {
    return { periods: [], unavailable: raw === "unavailable", malformed: false };
  }
  try {
    const parsed = JSON.parse(raw);
    return { periods: Array.isArray(parsed) ? parsed : [], unavailable: false, malformed: false };
  } catch (_) {
    // Distinct from a genuine "[]": the field held something, but it wasn't
    // readable JSON, so an empty strip here would look identical to a zone
    // with no periods configured today. Surface it the same way `unavailable`
    // is surfaced, rather than swallowing it into a silent empty list.
    return { periods: [], unavailable: false, malformed: true };
  }
}

// "HH:MM", strictly -- the same shape `timeToMinutes` accepts, checked
// separately here because `timeToMinutes` itself must stay total (0 for
// garbage) for the arithmetic downstream; this is the gate that decides
// whether an entry is drawn at all.
const PERIOD_TIME_RE = /^([0-9]{1,2}):([0-9]{2})$/;

function validPeriodEntry(period) {
  return !!period && typeof period === "object" &&
    typeof period.name === "string" &&
    typeof period.from === "string" && PERIOD_TIME_RE.test(period.from) &&
    typeof period.to === "string" && PERIOD_TIME_RE.test(period.to);
}

// Splits a parsed `periods_today` array into the entries worth drawing and a
// count of the ones that are not -- garbage from a payload this page cannot
// trust wholesale just because it parsed as JSON. The good entries are kept
// in order, so the strip still reads left-to-right; the bad ones are simply
// gone from the strip and only survive as a count in the note.
function splitValidPeriods(periods) {
  const valid = [];
  let invalidCount = 0;
  for (const period of periods) {
    if (validPeriodEntry(period)) valid.push(period); else invalidCount++;
  }
  return { valid, invalidCount };
}

// The `.strip-note` text under the ticks, or "" for a strip with nothing to
// say. Combines two independent degradations that can both be true at
// once: some entries drawn are approximate (the sun fell back -- A2/A3),
// and some entries in the payload could not be drawn at all (B/8). Pure, so
// it is unit-tested directly rather than through a DOM diff.
function stripNoteFor(periods, invalidCount) {
  const notes = [];
  if (Array.isArray(periods) && periods.some(p => p && p.approximate)) {
    notes.push("sun times unavailable — periods drawn at the fixed fallback");
  }
  if (invalidCount > 0) {
    notes.push(`${invalidCount} period entr${invalidCount === 1 ? "y" : "ies"} unreadable`);
  }
  return notes.join(" · ");
}

// One lane: a label on the left, a track that fills the rest. `buildTrack`
// populates the track element; `laneClass` picks the track's height in CSS.
function tlLane(labelText, laneClass, buildTrack) {
  const row = document.createElement("div");
  row.className = "tl-lane-row " + laneClass;
  const label = document.createElement("div");
  label.className = "tl-label";
  label.textContent = labelText;
  row.appendChild(label);
  const track = document.createElement("div");
  track.className = "tl-track";
  buildTrack(track);
  row.appendChild(track);
  return row;
}

// The now-line + "future" shading, drawn identically into every track so a
// house of lanes reads as one line crossing all of them (PRD section 12).
// `withLabel` puts the tiny "now" caption above just this one track -- the
// periods lane, the top of the frame.
function addNowMarker(track, nowPct, withLabel) {
  const shade = document.createElement("div");
  shade.className = "tl-future";
  shade.style.width = (100 - nowPct) + "%";
  track.appendChild(shade);
  const line = document.createElement("div");
  line.className = "tl-now";
  line.style.left = nowPct + "%";
  track.appendChild(line);
  if (withLabel) {
    const label = document.createElement("div");
    label.className = "tl-now-label";
    label.style.left = nowPct + "%";
    label.textContent = "now";
    track.appendChild(label);
  }
}

// What today's periods lane draws, and the note underneath it (if any) --
// shared logic split out of buildTimeline() so an "unavailable" verdict can
// still return something drawable (the whole point: the schedule is context
// even when the history file is not).
function periodsForTimeline(s) {
  const { periods: rawPeriods, unavailable, malformed } = parsePeriodsToday(s.periods_today);
  if (unavailable) return { periods: [], note: "period times unavailable" };
  if (malformed) return { periods: [], note: "period data unreadable" };
  const { valid: periods, invalidCount } = splitValidPeriods(rawPeriods);
  const note = stripNoteFor(periods, invalidCount) || (periods.length ? "" : (rawPeriods.length ? "period data unreadable" : ""));
  return { periods, note };
}

// The timeline: today's periods as context, then what actually happened --
// presence, each light, and override/off-duty/gap marks -- replacing the
// old green/hatched day strip (PRD section 12). `historyEvents` is this
// zone's raw event list from the history file, or null when it could not be
// read at all (see `historyErrorMsg`, which is shown instead of a blank
// timeline pretending nothing happened -- never silently omitted).
// `historyStatus` is the controller's own `history_status` state (not "ok"
// means the plugin itself is not currently WRITING the file, independent of
// whether this particular fetch just succeeded); `historyGeneratedAt` is the
// file's own `generated_at` timestamp, used to flag a file that is readable
// but stale; `noEntryYet` means the file loaded fine but has never recorded
// anything for this particular zone.
function buildTimeline(s, historyEvents, historyErrorMsg, lightsArr, zone, historyStatus, historyGeneratedAt, noEntryYet) {
  const wrap = document.createElement("div");
  wrap.className = "timeline-wrap";

  const now = new Date();
  const dayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const nowPct = pctOfDay(now, dayStart);

  const { periods, note: periodsNote } = periodsForTimeline(s);
  wrap.appendChild(
    tlLane("Periods", "tl-periods", track => {
      for (const period of periods) {
        const isActive = period.name === s.period;
        for (const seg of bandSegments(period)) {
          const band = document.createElement("div");
          band.className = "tl-period" + (period.mode === "off_only" ? " off-only" : "") +
            (isActive ? " active" : "") + (period.approximate ? " approximate" : "");
          band.style.left = seg.startPct + "%";
          band.style.width = seg.widthPct + "%";
          band.title = `${period.name} ${period.from}–${period.to} · ` +
            (period.mode === "off_only" ? "off only" : "on and off") +
            (period.approximate ? " · approximate: sun unavailable, drawn at the fixed fallback" : "");
          if (seg.widthPct >= 10) {
            const label = document.createElement("span");
            label.className = "tl-plabel";
            label.textContent = period.name;
            band.appendChild(label);
          }
          track.appendChild(band);
        }
      }
      addNowMarker(track, nowPct, true);
    })
  );
  if (periodsNote) {
    const note = document.createElement("div");
    note.className = "tl-note";
    note.textContent = periodsNote;
    wrap.appendChild(note);
  }

  // Shown regardless of whether THIS fetch happened to succeed: the plugin
  // itself may not be writing the file (a full disk, an unwritable Web
  // Assets folder) even while the last-good copy still reads fine.
  if (historyStatus != null && historyStatus !== "ok") {
    const note = document.createElement("div");
    note.className = "tl-unavailable";
    note.textContent = "history not being written: " + historyStatus;
    wrap.appendChild(note);
  }
  if (historyGeneratedAt) {
    const genMs = new Date(historyGeneratedAt).getTime();
    if (!isNaN(genMs) && (now.getTime() - genMs) > 10 * 60 * 1000) {
      const note = document.createElement("div");
      note.className = "tl-note";
      note.textContent = "history last written " + fmtTime(historyGeneratedAt);
      wrap.appendChild(note);
    }
  }

  if (historyEvents == null) {
    const note = document.createElement("div");
    note.className = "tl-unavailable";
    note.textContent = "history unavailable: " + (historyErrorMsg || "unknown reason");
    wrap.appendChild(note);
    return wrap;
  }

  if (noEntryYet) {
    const note = document.createElement("div");
    note.className = "tl-note";
    note.textContent = "no history for this zone yet";
    wrap.appendChild(note);
  }

  // Every lane below reads `usableEvents`, not the raw `historyEvents` --
  // one pass here drops (and counts) whatever a lane could never have used
  // anyway: an unparseable `t` (sorting on it would compare against NaN,
  // which is not a defined order), a `k` this page does not recognise, or a
  // `light`/`write` event whose `level` is not a number. Counted rather than
  // silently dropped (R15): an empty timeline and a timeline full of
  // unreadable events must not look the same.
  const KNOWN_EVENT_KINDS = new Set(["state", "presence", "light", "write", "override", "offduty", "gap"]);
  let unusableCount = 0;
  const usableEvents = [];
  for (const e of historyEvents) {
    if (!e || typeof e.t !== "string" || isNaN(new Date(e.t).getTime())) { unusableCount++; continue; }
    if (!KNOWN_EVENT_KINDS.has(e.k)) { unusableCount++; continue; }
    // A light REPORT is always numeric; a WRITE carries what the zone asked
    // for, which the reconciler sends as a number or as "on"/"off".
    if (e.k === "light" && typeof e.level !== "number") { unusableCount++; continue; }
    if (e.k === "write" && typeof e.level !== "number" && e.level !== "on" && e.level !== "off") { unusableCount++; continue; }
    usableEvents.push(e);
  }

  const dayStartMs = dayStart.getTime();
  const nowMs = now.getTime();

  // -- presence lane: filled where occupied/overridden, ticks on raw edges --
  const { occupied, overridden } = intervalsFromStates(usableEvents, dayStart, now);
  const presenceTicks = usableEvents.filter(e => {
    if (!e || e.k !== "presence" || e.on !== true) return false;
    const t = new Date(e.t).getTime();
    return !isNaN(t) && t >= dayStartMs && t <= nowMs;
  });
  wrap.appendChild(
    tlLane("Presence", "tl-presence", track => {
      for (const iv of unionIntervals(occupied.concat(overridden))) {
        const block = document.createElement("div");
        block.className = "tl-presence-block";
        block.style.left = pctOfDay(new Date(iv[0]), dayStart) + "%";
        block.style.width = Math.max(0, pctOfDay(new Date(iv[1]), dayStart) - pctOfDay(new Date(iv[0]), dayStart)) + "%";
        track.appendChild(block);
      }
      for (const ev of presenceTicks) {
        const tick = document.createElement("div");
        tick.className = "tl-presence-tick";
        tick.style.left = pctOfDay(new Date(ev.t), dayStart) + "%";
        tick.title = `presence: ${presenceInputLabel(ev)} at ${fmtTime(ev.t)}`;
        track.appendChild(tick);
      }
      addNowMarker(track, nowPct, false);
    })
  );

  // -- one lane per light, in desired_summary order --
  for (const item of lightsArr) {
    const deviceId = parseInt(item.id, 10);
    if (isNaN(deviceId)) continue;
    const intervals = levelIntervals(usableEvents, deviceId, dayStart, now);
    const writeTicks = usableEvents.filter(e => {
      if (!e || e.k !== "write" || e.id !== deviceId) return false;
      const t = new Date(e.t).getTime();
      return !isNaN(t) && t >= dayStartMs && t <= nowMs;
    });
    const name = lightName(item.id);
    wrap.appendChild(
      tlLane(laneLabel(name, zone), "tl-lights", track => {
        track.title = name;
        for (const iv of intervals) {
          const fill = document.createElement("div");
          fill.className = "tl-light-fill";
          fill.style.left = pctOfDay(new Date(iv[0]), dayStart) + "%";
          fill.style.width = Math.max(0, pctOfDay(new Date(iv[1]), dayStart) - pctOfDay(new Date(iv[0]), dayStart)) + "%";
          fill.style.opacity = String(0.25 + 0.75 * (iv[2] / 100));
          fill.title = `${name}: ${iv[2]}% ${fmtTime(new Date(iv[0]).toISOString())}–${fmtTime(new Date(iv[1]).toISOString())}`;
          track.appendChild(fill);
        }
        for (const ev of writeTicks) {
          const tick = document.createElement("div");
          tick.className = "tl-light-tick";
          tick.style.left = pctOfDay(new Date(ev.t), dayStart) + "%";
          tick.title = `commanded ${ev.level} at ${fmtTime(ev.t)}`;
          track.appendChild(tick);
        }
        addNowMarker(track, nowPct, false);
      })
    );
  }

  // -- marks lane: override spans, off-duty-bright glyphs, gap markers --
  // `usableEvents` already guarantees a parseable `t` on every event, so the
  // sort below never compares against NaN (undefined order); an `end` with
  // no open `start` to close is a real pairing problem, not a shape one, and
  // is counted here rather than by the general pass above.
  const overrideEvents = usableEvents.filter(e => e.k === "override");
  const overrideSpans = [];
  let openOverride = null;
  for (const ev of overrideEvents.slice().sort((a, b) => new Date(a.t) - new Date(b.t))) {
    if (ev.phase === "start") {
      openOverride = ev;
    } else if (ev.phase === "end") {
      if (openOverride) {
        overrideSpans.push({ start: openOverride.t, end: ev.t, device: openOverride.device });
        openOverride = null;
      } else {
        unusableCount++;
      }
    }
  }
  if (openOverride) overrideSpans.push({ start: openOverride.t, end: null, device: openOverride.device });

  const gaps = usableEvents.filter(e => e.k === "gap");

  wrap.appendChild(
    tlLane("Marks", "tl-marks", track => {
      for (const span of overrideSpans) {
        const startMs = new Date(span.start).getTime();
        const endMs = span.end ? new Date(span.end).getTime() : nowMs;
        // `isNaN(endMs)` guards a span whose `end` string is present but
        // will not parse -- without it `Math.min(endMs, nowMs)` and every
        // percentage derived from it below become NaN, rendering a
        // zero/garbled-width mark instead of skipping it.
        if (isNaN(startMs) || isNaN(endMs) || endMs < dayStartMs || startMs > nowMs) continue;
        const clampedStart = Math.max(startMs, dayStartMs);
        const clampedEnd = Math.min(endMs, nowMs);
        const el = document.createElement("div");
        el.className = "tl-mark override";
        el.style.left = pctOfDay(new Date(clampedStart), dayStart) + "%";
        el.style.width = Math.max(0, pctOfDay(new Date(clampedEnd), dayStart) - pctOfDay(new Date(clampedStart), dayStart)) + "%";
        const ownerName = span.device === -1 || span.device === "-1" ? "manual lock" : lightName(String(span.device));
        el.title = `override by ${ownerName} · ${fmtTime(span.start)}–${span.end ? fmtTime(span.end) : "now"}`;
        const glyph = document.createElement("span");
        glyph.textContent = "🔒";
        el.appendChild(glyph);
        track.appendChild(el);
      }
      for (const span of brightSpans(usableEvents)) {
        const endMs = span.end === null ? nowMs : span.end;
        if (endMs < dayStartMs || span.start > nowMs) continue;
        const clampedStart = Math.max(span.start, dayStartMs);
        const clampedEnd = Math.min(endMs, nowMs);
        const el = document.createElement("div");
        el.className = "tl-mark bright";
        el.style.left = pctOfDay(new Date(clampedStart), dayStart) + "%";
        el.style.width = Math.max(0.4, pctOfDay(new Date(clampedEnd), dayStart) - pctOfDay(new Date(clampedStart), dayStart)) + "%";
        el.title = `bright, so off duty · ${fmtTime(new Date(span.start).toISOString())}–${span.end === null ? "now" : fmtTime(new Date(span.end).toISOString())}`;
        const glyph = document.createElement("span");
        glyph.textContent = "☀";
        el.appendChild(glyph);
        track.appendChild(el);
      }
      for (const ev of gaps) {
        const t = new Date(ev.t).getTime();
        if (isNaN(t) || t < dayStartMs || t > nowMs) continue;
        const el = document.createElement("div");
        el.className = "tl-mark glyph";
        el.style.left = pctOfDay(new Date(t), dayStart) + "%";
        el.style.color = "var(--bad)";
        el.textContent = "⋯";
        el.title = "history truncated here";
        track.appendChild(el);
      }
      addNowMarker(track, nowPct, false);
    })
  );

  const ticks = document.createElement("div");
  ticks.className = "tl-ticks";
  const hourLabels = (typeof window !== "undefined" && window.innerWidth && window.innerWidth < 480)
    ? ["00", "12", "24"]
    : ["00", "06", "12", "18", "24"];
  for (const h of hourLabels) {
    const t = document.createElement("span");
    t.textContent = h;
    t.style.left = ((parseInt(h, 10) / 24) * 100) + "%";
    ticks.appendChild(t);
  }
  wrap.appendChild(ticks);

  if (unusableCount > 0) {
    const note = document.createElement("div");
    note.className = "tl-note";
    note.textContent = `${unusableCount} history event${unusableCount === 1 ? "" : "s"} could not be read`;
    wrap.appendChild(note);
  }

  const stats = statsFor(usableEvents, lightsArr.map(it => parseInt(it.id, 10)).filter(n => !isNaN(n)), dayStart, now);
  wrap.appendChild(buildStatsRow(stats));

  return wrap;
}

// `totalMinutes == null` renders "—": "nothing is known" (no lights
// configured for this zone) must never look like "zero minutes" (lights
// configured, genuinely never on).
function fmtMinutes(totalMinutes) {
  if (totalMinutes == null) return "—";
  const h = Math.floor(totalMinutes / 60);
  const m = Math.round(totalMinutes % 60);
  return `${h}h ${m}m`;
}

function buildStatsRow(stats) {
  const row = document.createElement("div");
  row.className = "tl-stats";

  const onWhileEmptyWarn = stats.onWhileEmptyMinutes > 15;
  const hereOffWarn = stats.hereLightsOffMinutes > 5;
  const cyclesText = stats.cycles == null ? "— on/off cycles" : `${stats.cycles} on/off cycle${stats.cycles === 1 ? "" : "s"}`;

  const parts = [
    `occupied ${fmtMinutes(stats.occupiedMinutes)}`,
    `lights on ${fmtMinutes(stats.lightsOnMinutes)}`,
    onWhileEmptyWarn
      ? { text: `on while empty ${fmtMinutes(stats.onWhileEmptyMinutes)}`, warn: true }
      : `on while empty ${fmtMinutes(stats.onWhileEmptyMinutes)}`,
    hereOffWarn
      ? { text: `here with lights off ${fmtMinutes(stats.hereLightsOffMinutes)}`, warn: true }
      : `here with lights off ${fmtMinutes(stats.hereLightsOffMinutes)}`,
    `${stats.overrideCount} override${stats.overrideCount === 1 ? "" : "s"}`,
    cyclesText,
  ];
  if (stats.unknownLights && stats.unknownLights.length > 0) {
    const n = stats.unknownLights.length;
    parts.push({ text: `${n} light${n === 1 ? "" : "s"} unknown`, warn: true });
  }

  parts.forEach((part, i) => {
    if (i > 0) row.appendChild(document.createTextNode(" · "));
    if (typeof part === "string") {
      row.appendChild(document.createTextNode(part));
    } else {
      const b = document.createElement("b");
      b.className = "warn-stat";
      b.textContent = part.text;
      row.appendChild(b);
    }
  });
  return row;
}

// Returns { el, mismatchCount, unknownCount } so the caller can roll both up
// into the header ("N lights off target", "N lights unknown") without
// re-parsing desired_summary or re-resolving each device's actual state.
function buildLightsSection(s) {
  const { items: lightsArr, unparsedCount } = parseDesired(s.desired_summary);
  let mismatchCount = 0;
  let unknownCount = 0;

  const wrap = document.createElement("div");
  const label = document.createElement("div");
  label.className = "section-label";
  const labelText = document.createElement("span");
  labelText.textContent = "Lights";
  label.appendChild(labelText);
  const offTarget = document.createElement("span");
  offTarget.className = "off-target";
  label.appendChild(offTarget);
  const unknownNote = document.createElement("span");
  unknownNote.className = "off-unknown";
  label.appendChild(unknownNote);
  wrap.appendChild(label);

  const list = document.createElement("ul");
  list.className = "lights";
  for (const l of lightsArr) {
    const dev = deviceById[l.id];
    const isMismatch = mismatch(l.level, dev);
    if (isMismatch) mismatchCount++;
    if (l.level !== "leave" && actualState(dev).kind === "unknown") unknownCount++;

    const li = document.createElement("li");
    if (isMismatch) li.className = "mismatch";
    const dot = document.createElement("span");
    dot.className = "dot";
    const nm = document.createElement("span");
    nm.className = "lname";
    nm.textContent = lightName(l.id);
    const desired = document.createElement("span");
    desired.className = "ldesired";
    desired.textContent = levelLabel(l.level);
    const arrow = document.createElement("span");
    arrow.className = "larrow";
    arrow.textContent = "→";
    const actual = document.createElement("span");
    actual.className = "lactual";
    actual.textContent = l.level === "leave" ? "" : actualLabel(dev);

    li.appendChild(dot);
    li.appendChild(nm);
    li.appendChild(desired);
    // A row that is on target reads as one value: "off → off" is noise, and
    // so is "100 % → on" for a relay that is exactly where it was asked to
    // be. The arrow and actual appear only when the light disagrees.
    if (l.level !== "leave" && isMismatch) {
      li.appendChild(arrow); li.appendChild(actual);
    }
    list.appendChild(li);
  }
  wrap.appendChild(list);

  // Both counts are degradation signals and both must show: a desired_summary
  // entry the page could not read is a light this card is silently missing.
  const notes = [];
  if (mismatchCount > 0) notes.push(`${mismatchCount} off target`);
  if (unparsedCount > 0) notes.push(`${unparsedCount} unparsed`);
  offTarget.textContent = notes.join(" · ");
  // A third, separate note: every light this card could not resolve at all
  // (actualState "unknown") is a whole row this card is silently blind to,
  // not merely off target — it gets its own amber note rather than being
  // folded into the red "off target" text, which would claim a comparison
  // this card was never able to make.
  unknownNote.textContent = unknownCount > 0 ? `${unknownCount} unknown` : "";
  return { el: wrap, mismatchCount, unknownCount };
}

// `raw` is `presence_inputs` from a zone's states, straight off the wire.
// `absent` (raw is null/undefined) is an OLDER plugin that never published
// this state at all -- the section is simply not there yet, not an error.
// `malformed` is a raw string this page received but could not parse -- a
// real degradation, distinct from both `absent` and a genuine "[]" (no
// inputs configured), and must not be swallowed into either.
function parsePresenceInputs(raw) {
  if (raw == null) return { inputs: [], malformed: false, absent: true };
  try {
    const parsed = JSON.parse(raw);
    return { inputs: Array.isArray(parsed) ? parsed : [], malformed: false, absent: false };
  } catch (_) {
    return { inputs: [], malformed: true, absent: false };
  }
}

function buildPresenceChips(s) {
  const { inputs, malformed, absent } = parsePresenceInputs(s.presence_inputs);
  if (absent) return null;
  if (malformed) {
    const note = document.createElement("div");
    note.className = "strip-note";
    note.textContent = "presence inputs unreadable";
    return note;
  }
  if (!inputs.length) return null;

  const wrap = document.createElement("div");
  const label = document.createElement("div");
  label.className = "section-label";
  label.textContent = "Presence inputs";
  wrap.appendChild(label);

  const row = document.createElement("div");
  row.className = "presence-row";
  for (const entry of inputs) {
    const chip = document.createElement("span");
    const cls = entry.on === true ? "on" : entry.on === false ? "off" : "unknown";
    chip.className = "pchip " + cls;
    chip.textContent = presenceInputLabel(entry) + (entry.last ? " " : "");
    if (entry.last) {
      const last = document.createElement("span");
      last.className = "last";
      last.textContent = "▲ last";
      chip.appendChild(last);
    }
    row.appendChild(chip);
  }
  wrap.appendChild(row);
  return wrap;
}

function buildFooter(dev, s) {
  const foot = document.createElement("div");
  foot.className = "foot";

  const disc = document.createElement("button");
  disc.className = "disclosure";
  disc.type = "button";
  const isOpen = openIds.has(String(dev.id));
  disc.setAttribute("aria-expanded", isOpen ? "true" : "false");
  disc.innerHTML = '<span class="tri">▸</span><span class="dlabel">Engine reasoning</span>';

  const explain = document.createElement("div");
  explain.className = "explain";
  explain.textContent = s.explain || "";
  explain.hidden = !isOpen;

  disc.addEventListener("click", () => {
    const nowOpen = explain.hidden;
    explain.hidden = !nowOpen;
    disc.setAttribute("aria-expanded", nowOpen ? "true" : "false");
    const key = String(dev.id);
    if (nowOpen) openIds.add(key); else openIds.delete(key);
  });

  const counters = document.createElement("div");
  counters.className = "counters";
  const wr = s.writes_today != null ? s.writes_today : 0;
  const ev = s.evaluations_today != null ? s.evaluations_today : 0;
  const ov = s.overrides_today != null ? s.overrides_today : 0;
  counters.textContent = `${wr} writes · ${ev} evals · ${ov} override${ov === 1 ? "" : "s"}`;

  foot.appendChild(disc);
  foot.appendChild(counters);
  foot.appendChild(explain);
  return foot;
}

// Returns { el, mismatchCount, unknownCount } — the caller sums both across
// every card for the header's "N lights off target" / "N lights unknown".
// `historyZones` is the history file's `zones` object (id -> {events}), or
// null when the file could not be fetched/parsed at all -- see
// `buildTimeline`'s own handling of the two DIFFERENT things that can be
// missing: a fetch/parse failure (the whole file unavailable, `historyZones`
// itself null -- the "history unavailable" note) versus a readable file that
// simply has no entry for THIS zone yet (brand new, or nothing has happened
// -- the much quieter "no history for this zone yet" note, computed below as
// `noEntryYet` and passed through).
function buildCard(dev, historyZones, historyErrorMsg, historyStatus, historyGeneratedAt) {
  const hasStates = !!(dev.states && Object.keys(dev.states).length);
  const s = dev.states || {};
  const offFlag = isOff(dev);
  const card = document.createElement("div");
  card.className = "card" + (offFlag ? " disabled" : "");
  card.dataset.id = dev.id;

  card.appendChild(buildTitleRow(dev, s, offFlag));

  if (!hasStates) {
    // A zone device that hasn't finished starting has no states at all yet --
    // don't fabricate a period/lux/presence reading it never reported.
    const notice = document.createElement("div");
    notice.className = "verdict";
    notice.textContent = "no state reported (device not started?)";
    card.appendChild(notice);
    return { el: card, mismatchCount: 0, unknownCount: 0 };
  }

  const subline = buildOverrideSubline(s);
  if (subline) card.appendChild(subline);

  const verdict = document.createElement("div");
  verdict.className = "verdict";
  verdict.textContent = verdictFor(s, offFlag);
  card.appendChild(verdict);

  card.appendChild(buildFacts(s));

  const { items: lightsForTimeline } = parseDesired(s.desired_summary);
  const zoneEntry = historyZones ? historyZones[zoneName(dev)] : null;
  const historyEvents = historyZones ? (zoneEntry && Array.isArray(zoneEntry.events) ? zoneEntry.events : []) : null;
  const noEntryYet = !!historyZones && !zoneEntry;
  card.appendChild(buildTimeline(
    s, historyEvents, historyErrorMsg, lightsForTimeline, zoneName(dev),
    historyStatus, historyGeneratedAt, noEntryYet
  ));

  const { el: lightsEl, mismatchCount, unknownCount } = buildLightsSection(s);
  card.appendChild(lightsEl);

  const presenceEl = buildPresenceChips(s);
  if (presenceEl) card.appendChild(presenceEl);

  card.appendChild(buildFooter(dev, s));

  return { el: card, mismatchCount, unknownCount };
}

// Called on every successful device poll (see `onPollOk`), payload and all,
// and re-called (with the same `all`) whenever the SEPARATE history poll
// lands -- see `pollHistoryOnce` -- because the device-list diff below has
// no way to know the timeline changed when the device list did not. The
// non-array guard runs every time regardless of whether the payload changed
// -- a persistently malformed response must keep saying so, not just once.
// `lastRenderedJson` gates only the DOM rebuild below it.
function render(all) {
  if (!Array.isArray(all)) {
    showErr("Unexpected response from Indigo (not a device list)");
    lastRenderedJson = null;
    return;
  }
  lastDevicesPayload = all;

  const json = JSON.stringify(all) + "|" + historyRenderKey;
  if (json === lastRenderedJson) return;
  lastRenderedJson = json;

  deviceNames = {};
  deviceById = {};
  for (const d of all) {
    deviceNames[String(d.id)] = d.name || ("#" + d.id);
    deviceById[String(d.id)] = d;
  }

  const zones = all.filter(d => d.pluginId === PLUGIN_ID && d.deviceTypeId === ZONE_TYPE);
  const ctrl = all.find(d => d.pluginId === PLUGIN_ID && d.deviceTypeId === CTRL_TYPE) || null;

  const grid = $("grid");
  const empty = $("empty");
  const legend = $("legend");
  if (!zones.length) {
    grid.textContent = "";
    empty.hidden = false;
    legend.hidden = true;
    renderHeader(ctrl, 0);
    return;
  }
  empty.hidden = true;
  legend.hidden = false;

  // Attention order: overridden, occupied, vacant, off-duty, disabled; ties
  // by name (sortRank is pure and table-driven-tested on its own).
  zones.sort((a, b) => {
    const rankDiff = sortRank(a.states, isOff(a)) - sortRank(b.states, isOff(b));
    return rankDiff !== 0 ? rankDiff : zoneName(a).localeCompare(zoneName(b));
  });

  const historyStatus = ctrl && ctrl.states ? ctrl.states.history_status : null;

  grid.textContent = "";
  let totalMismatches = 0;
  let totalUnknowns = 0;
  for (const z of zones) {
    const { el, mismatchCount, unknownCount } = buildCard(
      z, historyZones, historyErrorMsg, historyStatus, historyGeneratedAt
    );
    totalMismatches += mismatchCount;
    totalUnknowns += unknownCount;
    grid.appendChild(el);
  }
  renderHeader(ctrl, totalMismatches, totalUnknowns);
}

// Runs on every successful poll, changed or not, so the banner and the
// timestamp reflect that the connection is alive even when nothing in the
// device list moved (and `render`, called right after, may still redisplay
// a content error over top of the just-cleared banner).
function onPollOk() {
  if (authFailed) return;
  showErr("");
  $("updated").textContent = "updated " + fmtClock(new Date());
}

// ── the history poll: a second fetch, on its own loop, never sharing the
// device poll's error handling (a missing/broken history file is a
// per-card note, not a page-wide connection error). Uses its own IndigoAPI
// instance so a history fetch failure never reaches the device poll's
// `onError`/`onAuthFailure` handlers. Self-scheduling like `_pollLoop`, so
// a slow or hanging fetch cannot stack overlapping requests either.
let historyZones = null;      // parsed `zones` object from the file, or null if unavailable
let historyErrorMsg = null;   // why, when historyZones is null
let historyGeneratedAt = null; // the file's own `generated_at`, or null if unavailable
let historyRenderKey = "";    // folded into render()'s dedupe key so a history-only change still redraws
let historyApi = null;
let lastDevicesPayload = null;
let historyPollInFlight = false;

// The only version this page knows how to read (history.py's `VERSION`).
const HISTORY_FILE_VERSION = 1;

async function pollHistoryOnce() {
  if (!historyApi || historyPollInFlight) return;
  historyPollInFlight = true;
  try {
    const data = await historyApi.getHistory();
    if (data && typeof data === "object" && data.version !== HISTORY_FILE_VERSION) {
      historyZones = null;
      historyGeneratedAt = null;
      historyErrorMsg = `history file is version ${data.version}; this page reads version ${HISTORY_FILE_VERSION}`;
    } else if (data && typeof data === "object" && data.zones && typeof data.zones === "object") {
      historyZones = data.zones;
      historyGeneratedAt = typeof data.generated_at === "string" ? data.generated_at : null;
      historyErrorMsg = null;
    } else {
      historyZones = null;
      historyGeneratedAt = null;
      historyErrorMsg = "the history file did not contain a readable zones object";
    }
  } catch (err) {
    historyZones = null;
    historyGeneratedAt = null;
    historyErrorMsg = (err && err.status === 404)
      ? "no history file yet — the plugin writes it within 30 s of the first event"
      : (err && err.message) || "fetch failed";
  } finally {
    historyPollInFlight = false;
    // Only reset the render gate (and re-render) when something the
    // timeline actually reads has changed -- previously this ran
    // unconditionally on every poll, forcing a full DOM rebuild every 5 s
    // even on a perfectly quiet house.
    const key = JSON.stringify(historyZones) + "|" + historyErrorMsg + "|" + historyGeneratedAt;
    if (key !== historyRenderKey) {
      historyRenderKey = key;
      if (lastDevicesPayload) {
        lastRenderedJson = null; // force the next render() to rebuild
        try {
          render(lastDevicesPayload);
        } catch (e) {
          showErr("timeline render failed: " + e.message);
        }
      }
    }
  }
}

function startHistoryPolling(intervalMs = 5000) {
  pollHistoryOnce();
  setInterval(pollHistoryOnce, intervalMs);
}

async function init() {
  if (typeof IndigoAPI === "undefined" || !IndigoAPI.isConfigured()) {
    showErr("Not connected to Indigo. Open this page from the Indigo server or the dom.io app.");
    return;
  }
  indigo = new IndigoAPI();
  historyApi = new IndigoAPI(); // separate instance: its fetch failures never reach onError below
  indigo.onError(e => {
    if (authFailed) return;
    lastRenderedJson = null; // so the next success is a full rebuild, not a no-op diff
    showErr("Indigo error: " + e.message);
  });
  indigo.onAuthFailure(() => {
    authFailed = true;
    if (watcher) { watcher.stop(); watcher = null; }
    showErr("Authentication failed — reload the page with a valid ?api-key=");
  });
  watcher = indigo.observeAll(render, 5000, onPollOk);
  startHistoryPolling(5000);
}

init();
</script>
</body>
</html>
